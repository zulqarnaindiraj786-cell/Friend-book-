# Production Worker rollout: D1 interactions/documents and R2 video enabled; Firebase remains login identity only.
name = "rough-firefly-dd7b"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
# Public app gate; config/ads and AdMob consent still apply in Android.
ADS_ENABLED_V3 = "true"
CF_ACCOUNT_ID = "92f3d04598822de2e49e14561218d090"
FIREBASE_PROJECT_ID = "friendbook-17551"
# Server-side authority for free verification reviews; Firebase Auth UID, not a secret.
PAYMENT_ADMIN_UIDS = "ZlCw7oeKitPbhAcEryjnz2Do2Ky2"
D1_INTERACTIONS_ENABLED = "true"
# Additive indexes have an automatic fallback when absent; disable to roll back.
FRIEND_GUARD_INDEXED = "true"
# Cut over document reads/writes only when the deploy workflow's full coverage gate passes.
DOCUMENT_MIRROR_MODE = "canonical"
VIDEO_R2_ENABLED = "true"
VIDEO_R2_RETENTION_VERIFIED = "true"
CLOUDINARY_CLOUD_NAME = "x5ed4d0b"
CLOUDINARY_UPLOAD_PRESET = "Myapp_upload"

# One maintenance pass every 15 minutes; never per second or per minute.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "friendbook-db"
database_id = "e1c605ca-a50b-46c6-9deb-56dd1f70d163"
migrations_dir = "cloudflare/migrations"

# Publish only the allowlisted website files, not docs/testing or source code.
[build]
command = "npm run build:assets"

[assets]
directory = "./.worker-assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Every view is one Analytics Engine event; the count is AE's uniq(uid) per Reel/post, so
# "1 user = 1 view" needs no D1 row at all. Never written to D1, never read from it.
[[analytics_engine_datasets]]
binding = "ANALYTICS_ENGINE"
dataset = "friendbook_views"

# Existing owner-provided bucket. Never create or replace it.
[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "friendbook"

[[durable_objects.bindings]]
name = "LIVE_RELAY"
class_name = "LiveRelay"

[[migrations]]
tag = "live-relay-v1"
new_sqlite_classes = ["LiveRelay"]

[[durable_objects.bindings]]
name = "CALL_RELAY"
class_name = "CallRelay"

[[migrations]]
tag = "call-relay-v1"
new_sqlite_classes = ["CallRelay"]

# Cloudflare Workers Builds runs `wrangler preview`. Do not bind previews to
# production D1, R2, or Analytics Engine; provision dedicated staging resources
# before enabling those bindings. Preview DO namespaces are isolated by Cloudflare.
[previews.vars]
ADS_ENABLED_V3 = "false"
CF_ACCOUNT_ID = "preview-disabled"
FIREBASE_PROJECT_ID = "preview-disabled"
PAYMENT_ADMIN_UIDS = ""
D1_INTERACTIONS_ENABLED = "false"
FRIEND_GUARD_INDEXED = "false"
DOCUMENT_MIRROR_MODE = "dual"
VIDEO_R2_ENABLED = "false"
VIDEO_R2_RETENTION_VERIFIED = "false"
CLOUDINARY_CLOUD_NAME = ""
CLOUDINARY_UPLOAD_PRESET = ""

[[previews.durable_objects.bindings]]
name = "LIVE_RELAY"
class_name = "LiveRelay"

[[previews.durable_objects.bindings]]
name = "CALL_RELAY"
class_name = "CallRelay"
