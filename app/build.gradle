plugins {
    id 'org.jetbrains.kotlin.android'
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.friendbook.social'
    compileSdk 36

    defaultConfig {
        applicationId 'com.friendbook.social'
        buildConfigField 'boolean', 'D1_INTERACTIONS_ENABLED', 'true'
        buildConfigField 'boolean', 'CLOUDFLARE_PRESENCE_ENABLED', 'true'
        // Real view counters live in Cloudflare Analytics Engine (one event per view, uniq(uid) = one
        // view per user forever, zero D1 writes). The Home Feed does zero views work: no request, no
        // D1, no KV. Firebase is auth only.
        buildConfigField 'boolean', 'CLOUDFLARE_VIEWS_ENABLED', 'true'
        // Cloudflare Data API (Firestore/RTDB replacement). ON: the app's data plane is the
        // Worker + D1. Firebase keeps auth, FCM, Crashlytics and the offline document cache only.
        buildConfigField 'boolean', 'CLOUDFLARE_DATA_ENABLED', 'true'
        buildConfigField 'String', 'SUPABASE_URL', '"https://iqtccjgpbtnfavbkbogr.supabase.co"'
        minSdk 24
        targetSdk 36
        versionCode 137
        versionName '2.10.1'
        ndk {
            debugSymbolLevel 'FULL'
        }
        manifestPlaceholders = [
            privacyPolicyUrl: 'https://docs.google.com/document/d/1k3JAnk4U2S_cC8aLl2nNVpdglw-UxzSzBamWV-UfEkw/view'
        ]
    }

    signingConfigs {
        release {
            // The keystore is NOT committed (see .gitignore) so it can never leak if this repo is
            // made public. Supply it either as a file or via Gradle properties / env vars:
            //   app/friendbook-release.p12   OR   -PfbStoreFile=... -PfbStorePassword=...
            //   FB_STORE_PASSWORD / FB_KEY_PASSWORD environment variables also work.
            def storePath = project.findProperty('fbStoreFile')
                    ?: System.getenv('FB_STORE_FILE')
                    ?: 'friendbook-release.p12'
            def storePw = project.findProperty('fbStorePassword')
                    ?: System.getenv('FB_STORE_PASSWORD')
                    ?: 'friendbook2026'
            def keyPw = project.findProperty('fbKeyPassword')
                    ?: System.getenv('FB_KEY_PASSWORD')
                    ?: storePw
            def alias = project.findProperty('fbKeyAlias')
                    ?: System.getenv('FB_KEY_ALIAS')
                    ?: 'friendbook'

            storeFile file(storePath)
            storeType 'PKCS12'
            storePassword storePw
            keyAlias alias
            keyPassword keyPw
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { buildConfig true }

    kotlinOptions { jvmTarget = "17" }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-messaging'
    // 🔐 App Check with Play Integrity (production) — MONITOR mode first, then ENFORCE
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    // Play In-App Updates. This is the only update path: a build older than the minimum
    // supported version must be replaced through the Play Store, never by sideloading an
    // APK, because a sideloaded build is not the artifact Play Store reviews analyse.
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.google.guava:guava:33.3.1-android'

    // 🔐 Direct Google Sign-In (Android Credential Manager + Play Services Auth + Firebase OAuth)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.browser:browser:1.8.0'

    // 📢 Google AdMob Production Ads SDK + UMP GDPR Consent SDK
    implementation 'com.google.android.gms:play-services-ads:22.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'

    // 📢 Meta Audience Network SDK + AdMob Adapter for Mediation
    // Meta Placement ID: 4871960679794940_4871960806461594
    implementation 'com.facebook.android:audience-network-sdk:6.14.0'
    // Meta Audience Network (AdMob mediation) — the real artifact is com.google.ads.mediation:facebook.
    // The old coordinate com.google.android.gms:play-services-ads-mediation-facebook does NOT exist
    // on any repository, which failed ':app:checkReleaseAarMetadata' and blocked every release build.
    // 6.14.0.0 is the adapter release verified against audience-network-sdk 6.14.0 (the version below).
    implementation 'com.google.ads.mediation:facebook:6.14.0.0'

    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
}