plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.frienbook'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.frienbook'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '525.0.0.102'

        // Firebase is authentication only: views live in Cloudflare Analytics Engine and app
        // documents are mirrored to Cloudflare D1 through the Worker.
        buildConfigField 'boolean', 'CLOUDFLARE_VIEWS_ENABLED', 'true'
        buildConfigField 'boolean', 'CLOUDFLARE_DOCS_MIRROR', 'true'
        buildConfigField 'boolean', 'D1_INTERACTIONS_ENABLED', 'false'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    // Firebase is AUTHENTICATION ONLY. Data: Cloudflare D1. Media: Cloudflare R2. Views: Cloudflare
    // Analytics Engine. Presence/typing: Cloudflare Worker. Runtime switches: Worker /v1/config.
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // 📢 Google AdMob (banner in home feed)
    implementation 'com.google.android.gms:play-services-ads:22.6.0'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
