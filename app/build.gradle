plugins {
    id 'org.jetbrains.kotlin.android'
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.friendbook.social'
    compileSdk 36

    defaultConfig {
        applicationId 'com.friendbook.social'
        buildConfigField 'boolean', 'D1_INTERACTIONS_ENABLED', 'true'
        buildConfigField 'boolean', 'CLOUDFLARE_PRESENCE_ENABLED', 'true'
        // Real view counters live in Cloudflare Analytics Engine (one event per view, uniq(uid) = one
        // view per user forever, zero D1 writes). The Home Feed does zero views work: no request, no
        // D1, no KV. Firebase is auth only.
        buildConfigField 'boolean', 'CLOUDFLARE_VIEWS_ENABLED', 'true'
        buildConfigField 'String', 'CLOUDFLARE_API_URL', '"https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev"'
        minSdk 24
        targetSdk 36
        versionCode 130
        versionName '2.8.98'
        ndk {
            debugSymbolLevel 'FULL'
        }
        manifestPlaceholders = [
            privacyPolicyUrl: 'https://docs.google.com/document/d/1k3JAnk4U2S_cC8aLl2nNVpdglw-UxzSzBamWV-UfEkw/view'
        ]
    }

    def releaseStorePath = System.getenv('FRIENDBOOK_RELEASE_STORE_FILE')
    def releaseStorePassword = System.getenv('FRIENDBOOK_RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('FRIENDBOOK_RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('FRIENDBOOK_RELEASE_KEY_PASSWORD')
    def releaseSigningConfigured = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }
    project.ext.friendbookReleaseSigningConfigured = releaseSigningConfigured

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseStorePath)
                storeType 'PKCS12'
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Use Android's standard debug keystore; test builds must not depend on release credentials.
            minifyEnabled false
        }
    }

    // Prefer a smaller downloadable APK; ART can decompress DEX on installation.
    packaging { dex { useLegacyPackaging = true } }

    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { buildConfig true }

    kotlinOptions { jvmTarget = "17" }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

gradle.taskGraph.whenReady { graph ->
    def signedReleaseTasks = graph.allTasks.any { it.name in ['assembleRelease', 'bundleRelease'] }
    if (signedReleaseTasks && !project.ext.friendbookReleaseSigningConfigured) {
        throw new GradleException('Release APK/AAB signing is not configured. Supply FRIENDBOOK_RELEASE_STORE_FILE, FRIENDBOOK_RELEASE_STORE_PASSWORD, FRIENDBOOK_RELEASE_KEY_ALIAS, and FRIENDBOOK_RELEASE_KEY_PASSWORD through the CI secret store.')
    }
}

dependencies {
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // Firebase: ONLY Auth + FCM (all app data lives in Cloudflare D1 + R2)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.google.guava:guava:33.3.1-android'

    // 🔐 Direct Google Sign-In (Android Credential Manager + Play Services Auth + Firebase OAuth)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.browser:browser:1.8.0'

    // 📢 Google AdMob Production Ads SDK + UMP GDPR Consent SDK
    implementation 'com.google.android.gms:play-services-ads:22.5.0'
    // Placement mappings stay in AdMob; use the adapter from the GMA 22.x generation.
    implementation 'com.google.ads.mediation:facebook:6.16.0.0'
    implementation 'com.google.ads.mediation:applovin:12.1.0.1'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'

    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
