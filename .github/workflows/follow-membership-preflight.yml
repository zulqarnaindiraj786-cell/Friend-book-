# Read-only bounded aggregate: never prints user values or changes production data.
name: Follow-list membership preflight
on:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths: [.github/workflows/follow-membership-preflight.yml, scripts/loadtest/follow_membership_preflight.py]
permissions:
  contents: read
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[follow-membership-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read capped aggregates only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/follow_membership_preflight.py
