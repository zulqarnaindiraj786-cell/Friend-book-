# Privacy-preserving repeat-pattern sample; never output URLs, targets, identities, headers, bodies or raw events.
name: Incident aggregate Worker response sample
on:
  push:
    branches: ['arena/7c7ddb7b-friend-book']
    paths: ['.github/workflows/incident-tail.yml']
permissions: {}
jobs:
  sample:
    if: contains(github.event.head_commit.message, '[incident-tail]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count endpoint categories, methods and HTTP statuses for up to two minutes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 92f3d04598822de2e49e14561218d090
        run: |
          python3 - <<'PY'
          import subprocess,select,time,json,urllib.parse,collections,os,signal
          p=subprocess.Popen(['npx','--yes','wrangler@4.157.0','tail','rough-firefly-dd7b','--format','json'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,start_new_session=True)
          counts=collections.Counter();methods=collections.Counter();write_roots=collections.Counter();denied_targets=collections.Counter();target_overflow=0;deadline=time.monotonic()+135;buffer='';decoder=json.JSONDecoder();objects=0
          def handle(event):
            global objects, target_overflow
            if isinstance(event,list):
              for item in event: handle(item)
              return
            if not isinstance(event,dict): return
            objects+=1
            details=event.get('event') or {}
            if not isinstance(details,dict): return
            request=details.get('request') or {}
            if not isinstance(request,dict) or not isinstance(request.get('url'),str) or not request.get('url'): return
            parsed=urllib.parse.urlsplit(request['url']);path=parsed.path
            # Only aggregate fixed root categories; never emit the URL, ID, query
            # string, body or a rare single-category count. These are requests,
            # not a measurement of D1 rows or proof that a write committed.
            method=request.get('method','')
            if path=='/v1/firestore/document' and method in ('PUT','PATCH','DELETE','POST'):
              query=urllib.parse.parse_qs(parsed.query)
              doc=(query.get('path') or [''])[0]
              root=doc.split('/',1)[0]
              if root not in ('users','posts','reels','stories','notifications','chats','friend_requests','friends','groups','lives'): root='other'
              write_roots[(method,root)]+=1
            if path.startswith('/v1/engagement/'):
              parts=path.split('/'); route='engagement/'+(parts[3] if len(parts)>3 and parts[3] in ('posts','reels') else 'other')+'/'+(parts[5] if len(parts)>5 and parts[5] in ('reactions','comments','reactors') else 'other')
            elif path.startswith('/v1/firestore/'):
              parts=path.split('/'); route='firestore/'+(parts[3] if len(parts)>3 and parts[3] in ('document','query','batch','count','profile-bootstrap') else 'other')
            elif path.startswith('/v1/presence/'):
              part=path.split('/')[3] if len(path.split('/'))>3 else ''
              route='presence/'+(part if part in ('typing','contact','socket','me') else 'other')
            elif path.startswith('/v1/'): route='other-api'
            else: route='other'
            response=details.get('response') or {}
            status=response.get('status') if isinstance(response,dict) else 0
            if type(status) is not int: status=0
            counts[(route,status)]+=1
            methods[(route,method if method in ('GET','POST','PUT','PATCH','DELETE') else 'other')]+=1
            # Count target repetition only in memory. No path, token, identity,
            # per-target count or reversible hash is ever printed or saved.
            # A target may be requested by multiple actors; this is not a per-user count.
            if route=='presence/contact' and status==403:
              if path in denied_targets or len(denied_targets)<1000: denied_targets[path]+=1
              else: target_overflow+=1
          try:
            while time.monotonic()<deadline:
              readable,_,_=select.select([p.stdout],[],[],min(1,max(0,deadline-time.monotonic())))
              if not readable:
                if p.poll() is not None: break
                continue
              chunk=os.read(p.stdout.fileno(),65536)
              if not chunk: break
              buffer+=chunk.decode('utf-8','replace')
              while buffer:
                starts=[i for i in (buffer.find('{'),buffer.find('[')) if i>=0]
                if not starts: buffer='';break
                buffer=buffer[min(starts):]
                try: event,end=decoder.raw_decode(buffer)
                except ValueError:
                  if len(buffer)>1048576: buffer=''
                  break
                buffer=buffer[end:];handle(event)

          finally:
            try: os.killpg(p.pid,signal.SIGTERM)
            except ProcessLookupError: pass
            try: p.wait(timeout=5)
            except subprocess.TimeoutExpired:
              os.killpg(p.pid,signal.SIGKILL);p.wait()
          print('::notice::Aggregate live sample; no URLs, identities or bodies: '+json.dumps([{'route':k[0],'status':k[1],'count':v} for k,v in sorted(counts.items())]))
          common_methods=[{'route':k[0],'method':k[1],'count':v} for k,v in sorted(methods.items()) if v>=3]
          print('::notice::Request methods by allowlisted route (rare categories suppressed; not D1 costs): '+json.dumps({'categories':common_methods,'suppressed_requests':sum(v for v in methods.values() if v<3)}))
          if sum(denied_targets.values())>=3:
            print('::notice::Denied contact aggregate; target may be shared by multiple users: '+json.dumps({'requests':sum(denied_targets.values()),'distinct_targets':len(denied_targets),'requests_to_targets_with_3_or_more':sum(n for n in denied_targets.values() if n>=3),'overflow_requests':target_overflow}))
          common=[{'method':k[0],'root':k[1],'count':v} for k,v in sorted(write_roots.items()) if v>=3]
          rare=sum(v for v in write_roots.values() if v<3)
          print('::notice::Document mutation requests by allowlisted root (rare categories suppressed; not database writes): '+json.dumps({'categories':common,'suppressed_requests':rare}))
          if not counts: print('::warning::No parseable live HTTP events; decoded objects:',objects,'; do not infer absence of errors.')
          PY
