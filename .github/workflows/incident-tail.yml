# Bounded live diagnosis. Never log URLs, headers, identities, bodies, or raw tail events.
name: Incident aggregate Worker response sample
on:
  push:
    branches: ['arena/7c7ddb7b-friend-book']
    paths: ['.github/workflows/incident-tail.yml']
permissions: {}
jobs:
  sample:
    if: contains(github.event.head_commit.message, '[incident-tail]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count endpoint categories and HTTP statuses for one minute
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 92f3d04598822de2e49e14561218d090
        run: |
          python3 - <<'PY'
          import subprocess,select,time,json,urllib.parse,collections,os,signal
          p=subprocess.Popen(['npx','--yes','wrangler@4.157.0','tail','rough-firefly-dd7b','--format','json'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,start_new_session=True)
          counts=collections.Counter();deadline=time.monotonic()+75
          try:
            while time.monotonic()<deadline:
              readable,_,_=select.select([p.stdout],[],[],min(1,max(0,deadline-time.monotonic())))
              if not readable:
                if p.poll() is not None: break
                continue
              line=p.stdout.readline()
              if not line:
                if p.poll() is not None: break
                continue
              try: event=json.loads(line)
              except (ValueError,UnicodeDecodeError): continue
              request=event.get('event',{}).get('request',{}) or {}
              path=urllib.parse.urlsplit(request.get('url','')).path
              if path.startswith('/v1/engagement/'):
                parts=path.split('/'); route='engagement/'+(parts[3] if len(parts)>3 and parts[3] in ('posts','reels') else 'other')+'/'+(parts[5] if len(parts)>5 and parts[5] in ('reactions','comments','reactors') else 'other')
              elif path.startswith('/v1/firestore/'):
                parts=path.split('/'); route='firestore/'+(parts[3] if len(parts)>3 and parts[3] in ('document','query','batch','count','profile-bootstrap') else 'other')
              elif path.startswith('/v1/presence/'): route='presence'
              elif path.startswith('/v1/'): route='other-api'
              else: route='other'
              status=event.get('event',{}).get('response',{}).get('status')
              if type(status) is not int: status=0
              counts[(route,status)]+=1
          finally:
            try: os.killpg(p.pid,signal.SIGTERM)
            except ProcessLookupError: pass
            try: p.wait(timeout=5)
            except subprocess.TimeoutExpired:
              os.killpg(p.pid,signal.SIGKILL);p.wait()
          print('::notice::Aggregate live sample; no URLs, identities or bodies: '+json.dumps([{'route':k[0],'status':k[1],'count':v} for k,v in sorted(counts.items())]))
          if not counts: print('::warning::No parseable live events; do not infer absence of errors.')
          PY
