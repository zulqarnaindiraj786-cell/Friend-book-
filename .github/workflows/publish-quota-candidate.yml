name: Publish already verified quota-fix Android candidate
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths: ['.github/workflows/publish-quota-candidate.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-quota-candidate]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '45166501055'
      BUILD_SHA: '7f76bb466918194c24efb8d25a949b9463ed5c55'
      TAG: 'friendbook-2.10.34-signed-7f76bb4'
    steps:
      - name: Require successful original signed build and signature verification
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > /tmp/source-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs" > /tmp/source-jobs.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/source-run.json'))
          assert run['head_sha']==os.environ['BUILD_SHA']
          assert run['head_branch']=='arena/b52bc74d-friend-book'
          assert run['conclusion']=='success'
          assert run['path']=='.github/workflows/build-apk.yml'
          steps=[step for job in json.load(open('/tmp/source-jobs.json'))['jobs'] for step in job['steps']]
          for name in ['Verify APK and AAB signatures','Require actual Android core test results, not source-only checks']:
              assert any(s['name']==name and s['conclusion']=='success' for s in steps),name
          PY
      - name: Download exact existing APK and AAB without rebuilding
        run: |
          gh run download "$BUILD_RUN" -n FriendBook-release-apk -D apk
          gh run download "$BUILD_RUN" -n FriendBook-playstore-aab -D aab
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for directory,suffix,name in [('apk','.apk','friendbook-2.10.34.apk'),('aab','.aab','friendbook-2.10.34.aab')]:
              files=list(Path(directory).rglob('*'+suffix))
              assert len(files)==1,(directory,len(files))
              shutil.copyfile(files[0],name)
          PY
          sha256sum friendbook-2.10.34.apk friendbook-2.10.34.aab > SHA256SUMS.txt
      - name: Publish stable download links as prerelease, never Latest or Play Store
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Candidate tag already exists; refusing to overwrite its assets.'
            exit 1
          fi
          gh release create "$TAG" friendbook-2.10.34.apk friendbook-2.10.34.aab SHA256SUMS.txt \
            --target "$BUILD_SHA" --prerelease --latest=false \
            --title 'FriendBook 2.10.34 (176) — signed quota-fix candidate' \
            --notes 'Existing signed APK and AAB from successful build 45166501055, source 7f76bb466918194c24efb8d25a949b9463ed5c55. Includes concurrent engagement GET coalescing. Original build verified signatures and Android core tests. Promoted without rebuilding; SHA256SUMS attached. PR #36 remains unmerged. Not a full-day quota/capacity pass, not uploaded to Google Play, not installed automatically. Backend preview optimization was deployed separately in run 45169771972. Production Latest release unchanged.'
