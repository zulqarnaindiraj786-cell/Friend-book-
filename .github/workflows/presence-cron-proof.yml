name: Presence and cron removal proof
on:
  workflow_dispatch:
  push:
    branches: ['arena/7c7ddb7b-friend-book']
    paths: ['.github/workflows/presence-cron-proof.yml']
permissions:
  contents: read
jobs:
  artifact:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[presence-cron-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKM="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          "$SDKM" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - name: Scan the compiled APK for presence endpoints or online-dot code
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -o -q "$apk" -d apk-contents
          # Full string context, so a third-party library string is distinguishable
          # from our own code. Only our identifiers fail the job.
          grep -a -h -o -i '.\{0,48\}presence.\{0,48\}' apk-contents/classes*.dex | sort -u > presence-strings.txt || true
          echo "::notice::presence-context count: $(wc -l < presence-strings.txt)"
          while IFS= read -r line; do echo "context: $line"; done < presence-strings.txt
          ! grep -a -q 'onlineDot' apk-contents/classes*.dex
          ! grep -a -q -i '/v1/presence' apk-contents/classes*.dex
          ! grep -a -q -i 'com/friendbook.*presence' apk-contents/classes*.dex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FriendBook-presence-cron-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            presence-strings.txt
          if-no-files-found: warn
      - name: Assert the deployable Worker config has no cron schedule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 deploy --dry-run --outdir dist-worker > dry-run.log 2>&1
          cat dry-run.log
          # Wrangler prints "No cron triggers" when the uploaded config has none.
          if grep -qi 'cron' dry-run.log && ! grep -qi 'no cron triggers' dry-run.log; then
            echo '::error::dry run reports a cron trigger'; exit 1
          fi
          ! grep -q '\[triggers\]' wrangler.toml
          ! grep -qE '^[[:space:]]*crons[[:space:]]*=' wrangler.toml
  logs:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[presence-cron-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count presence requests and cron invocations for about two minutes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 92f3d04598822de2e49e14561218d090
        run: |
          python3 - <<'PY'
          import subprocess,select,time,json,collections,os,signal,urllib.parse
          p=subprocess.Popen(['npx','--yes','wrangler@4.157.0','tail','rough-firefly-dd7b','--format','json'],
                             stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,start_new_session=True)
          deadline=time.monotonic()+125
          buffer='';decoder=json.JSONDecoder()
          events=http=0
          presence_route=collections.Counter()   # (http status) -> count
          presence_text_other=0
          non_http=0
          cron_minutes=set()
          roots=collections.Counter()
          def handle(obj):
            global events,http,presence_text_other,non_http
            if isinstance(obj,list):
              for item in obj: handle(item)
              return
            if not isinstance(obj,dict): return
            events+=1
            details=obj.get('event') or {}
            if not isinstance(details,dict): details={}
            request=details.get('request')
            if isinstance(request,dict) and isinstance(request.get('url'),str):
              http+=1
              parsed=urllib.parse.urlsplit(request['url'])
              path=parsed.path
              status=str((details.get('response') or {}).get('status'))
              if path.startswith('/v1/presence/'):
                # Worst-case: a route hit is a presence line in the log even when
                # the deployed Worker already answers 404.
                part=path.split('/')[3] if len(path.split('/'))>3 else 'other'
                presence_route[(part if part in ('me','contact','typing','socket') else 'other',status)]+=1
              elif 'presence' in json.dumps(obj).lower():
                presence_text_other+=1
              roots[path.split('/')[1] if path.startswith('/v1/') and len(path.split('/'))>1 else 'other']+=1
            else:
              non_http+=1
              stamp=str(obj.get('eventTimestamp') or details.get('eventTimestamp') or '')[:16]
              if stamp: cron_minutes.add(stamp)
          try:
            while time.monotonic()<deadline:
              r,_,_=select.select([p.stdout],[],[],min(1,max(0,deadline-time.monotonic())))
              if not r:
                if p.poll() is not None: break
                continue
              chunk=os.read(p.stdout.fileno(),65536)
              if not chunk: break
              buffer+=chunk.decode('utf-8','replace')
              while buffer:
                starts=[i for i in (buffer.find('{'),buffer.find('[')) if i>=0]
                if not starts: buffer='';break
                buffer=buffer[min(starts):]
                try: obj,end=decoder.raw_decode(buffer)
                except ValueError:
                  if len(buffer)>1048576: buffer=''
                  break
                buffer=buffer[end:];handle(obj)
          finally:
            try: os.killpg(p.pid,signal.SIGTERM)
            except ProcessLookupError: pass
            try: p.wait(timeout=5)
            except subprocess.TimeoutExpired:
              os.killpg(p.pid,signal.SIGKILL);p.wait()
          print('::notice::'+json.dumps({'window_seconds':120,'events':events,'http_events':http,
              'presence_route_requests':sum(presence_route.values()),
              'presence_route_by_route_and_status':[{'route':k[0],'status':k[1],'count':v} for k,v in sorted(presence_route.items())],
              'presence_text_without_presence_route':presence_text_other,
              'non_http_cron_invocations':non_http,'cron_minutes':len(cron_minutes),
              'http_roots':[{'root':k,'count':v} for k,v in sorted(roots.items()) if v>=3]}))
          if not events: print('::warning::No parseable tail events; do not infer absence of traffic.')
          if sum(presence_route.values()): print('::warning::A client still calls a presence route; the deployed Worker or an installed old APK still produces these lines.')
          if presence_text_other: print('::warning::Non-route log text matched presence; inspect manually.')
          if non_http: print('::warning::Cron invocations still appear until the Worker is uploaded without [triggers].')
          PY
