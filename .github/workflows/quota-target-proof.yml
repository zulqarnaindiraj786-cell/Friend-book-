# Recheck daily verdict after 2.10.34 build; no production SQL or deployment.
name: Strict quota target verification (not a guarantee)
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths:
      - '.github/workflows/quota-target-proof.yml'
      - 'scripts/loadtest/verify_quota_target.py'
      - 'scripts/tests/test_verify_quota_target.py'
permissions:
  contents: read
jobs:
  proof:
    if: contains(github.event.head_commit.message, '[verify-quota-target]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Worker and verification regression tests
        run: |
          npm test
          python3 -m unittest discover -s scripts/tests
      - name: Network-disabled real Worker replays at three workload sizes
        run: |
          mkdir -p /tmp/quota-target-proof
          for users in 10 30 100; do
            QUOTA_EXPERIMENT_FRIEND_INDEXES=1 node scripts/loadtest/d1_quota_replay.mjs "$users" > "/tmp/quota-target-proof/offline-${users}.json"
          done
      - name: Compile without deploying
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.157.0 deploy --dry-run --outdir /tmp/worker-bundle
      - name: Strict daily target check (only GraphQL; failure must remain failure)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/loadtest/verify_quota_target.py \
            --fixes-active-since 2026-11-23T12:36:39Z \
            --output /tmp/quota-target-proof/production-daily-verdict.json --enforce
      - name: Preserve proof even when the daily target fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quota-target-proof
          path: /tmp/quota-target-proof/*.json
          retention-days: 7
          if-no-files-found: warn
