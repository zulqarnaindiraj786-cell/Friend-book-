name: Cron schedule status probe
on:
  workflow_dispatch:
  push:
    branches: ['arena/7c7ddb7b-friend-book']
    paths: ['.github/workflows/cron-status.yml']
permissions: {}
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cron-status]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read, clear, and re-read the deployed cron schedules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          token = os.environ['CLOUDFLARE_API_TOKEN']
          account = '92f3d04598822de2e49e14561218d090'
          script = 'rough-firefly-dd7b'
          url = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{script}/schedules'

          def call(method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}', 'content-type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read() or b'{}')
              except urllib.error.HTTPError as error:
                  return error.code, {'body': error.read().decode('utf-8', 'replace')[:300]}

          def count():
              code, payload = call()
              schedules = ((payload.get('result') or {}).get('schedules') or [])
              return code, len(schedules), [s.get('cron') for s in schedules]

          print('::notice::t0 ' + json.dumps(dict(zip(('status','count','expressions'), count()))))
          code, payload = call('PUT', [])
          print('::notice::clear ' + json.dumps({'status': code, 'result': str(payload)[:200]}))
          code, n, expressions = count()
          print('::notice::t1_after_clear ' + json.dumps({'status': code, 'count': n, 'expressions': expressions}))
          time.sleep(75)
          code, n, expressions = count()
          print('::notice::t2_75s_later ' + json.dumps({'status': code, 'count': n, 'expressions': expressions}))
          if n:
              print('::warning::Schedules were re-created after the clear; something else registers them.')
          else:
              print('::notice::No cron schedule is attached to the deployed Worker.')
          PY
