# Bounded user-only promotion; no values or identities in logs.
# Preview run 45021216684 passed on both current candidates before enabling apply.
name: Legacy user promotion
on:
  workflow_dispatch:
    inputs:
      confirm_production_scan:
        description: 'Explicitly authorize production D1 diagnostic/migration cost; not routine app work'
        type: boolean
        default: false
        required: true
      mode:
        description: 'Explicit recovery operation'
        type: choice
        default: legacy-user-preview
        options: [legacy-user-preview, legacy-user-backfill, legacy-root-preview, legacy-request-preview, legacy-request-backfill, legacy-friend-preview, legacy-friend-backfill]
permissions:
  contents: read
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  promotion:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_scan == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test cloudflare/test/legacy-user-backfill.test.js
      - name: Check account reserve and compare representations
        if: inputs.mode == 'legacy-user-preview' || inputs.mode == 'legacy-user-backfill'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --notification-inspection-budget
          node scripts/loadtest/backfill_legacy_users.mjs
      - name: Preview all legacy-only root representations (read-only)
        if: inputs.mode == 'legacy-root-preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --notification-inspection-budget
          node scripts/loadtest/backfill_legacy_users.mjs --preview-roots
          python3 scripts/loadtest/d1_account_usage_analytics.py --notification-inspection-budget
      - name: Compare bounded friend-request candidates (read-only)
        if: inputs.mode == 'legacy-request-preview' || inputs.mode == 'legacy-request-backfill'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --notification-inspection-budget
          node scripts/loadtest/backfill_legacy_users.mjs --friend-requests
      # Preview 45022529063 checked the two current candidates without mutation.
      - name: Execute bounded friend-request promotion
        if: inputs.mode == 'legacy-request-backfill'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --user-backfill-budget
          node scripts/loadtest/backfill_legacy_users.mjs --friend-requests --apply
          python3 scripts/loadtest/d1_account_usage_analytics.py --user-backfill-budget
      - name: Compare bounded friendship candidates (read-only)
        if: inputs.mode == 'legacy-friend-preview' || inputs.mode == 'legacy-friend-backfill'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --notification-inspection-budget
          node scripts/loadtest/backfill_legacy_users.mjs --friends
      # Preview 45022699325 checked the current candidate without mutation.
      - name: Execute bounded friendship promotion
        if: inputs.mode == 'legacy-friend-backfill'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --user-backfill-budget
          node scripts/loadtest/backfill_legacy_users.mjs --friends --apply
          python3 scripts/loadtest/d1_account_usage_analytics.py --user-backfill-budget
      - name: Execute the explicitly requested, bounded user promotion
        if: inputs.mode == 'legacy-user-backfill'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --user-backfill-budget
          node scripts/loadtest/backfill_legacy_users.mjs --apply
          python3 scripts/loadtest/d1_account_usage_analytics.py --user-backfill-budget
