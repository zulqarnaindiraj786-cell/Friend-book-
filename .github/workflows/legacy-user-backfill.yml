# Bounded user-only promotion; no values or identities in logs.
name: Legacy user promotion
on:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths: [.github/workflows/legacy-user-backfill.yml, scripts/loadtest/backfill_legacy_users.mjs, cloudflare/test/legacy-user-backfill.test.js]
permissions:
  contents: read
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  promotion:
    if: contains(github.event.head_commit.message, '[legacy-user-preview]') || contains(github.event.head_commit.message, '[legacy-user-backfill]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test cloudflare/test/legacy-user-backfill.test.js
      - name: Check account reserve and compare representations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --notification-inspection-budget
          node scripts/loadtest/backfill_legacy_users.mjs
      - name: Execute the explicitly requested, bounded user promotion
        if: contains(github.event.head_commit.message, '[legacy-user-backfill]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --user-backfill-budget
          node scripts/loadtest/backfill_legacy_users.mjs --apply
          python3 scripts/loadtest/d1_account_usage_analytics.py --user-backfill-budget
