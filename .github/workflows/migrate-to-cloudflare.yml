name: Migrate Firebase to Cloudflare

on:
  workflow_dispatch:
    inputs:
      run_migration:
        description: 'Run full migration (backup → deploy → migrate → verify → build)'
        required: true
        default: 'true'
        type: boolean
  push:
    # Only this workflow's own edits retrigger it; a normal code push must never start
    # a data migration by accident.
    branches: [ main, 'arena/f6bf61bd-friend-book' ]
    paths:
      - '.github/workflows/migrate-to-cloudflare.yml'
      # The script this pipeline runs. Without it, a fix to the migration itself does not
      # trigger the pipeline that exercises it, which is how the last fix sat unrun.
      - 'scripts/migrate_firestore_to_d1.py'
      - 'scripts/verify_migration.py'

permissions:
  contents: write
  actions: read
  id-token: write

env:
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_D1_DATABASE_ID: e1c605ca-a50b-46c6-9deb-56dd1f70d163
  CF_WORKERS_API_BASE: ${{ secrets.CF_WORKERS_API_BASE }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  MIGRATION_ADMIN_TOKEN: ${{ secrets.MIGRATION_ADMIN_TOKEN }}

jobs:
  migrate:
    name: Full Migration Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      # ============ SETUP ============
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # wrangler@4.157.0 refuses to start on Node 20 (it needs a newer runtime); the
          # deploy workflow has used 22 all along, which is why deploys work and this
          # pipeline died at the wrangler install step every time.
          node-version: '22'
      
      - name: Install Python dependencies
        run: |
          pip install firebase-admin requests
      
      - name: Install Wrangler
        # Installed into the workspace rather than globally or via npx: a global bin is
        # not reliably on PATH on these runners, and npx re-resolves on every call. A
        # local install is one pinned download at a known path, so later steps invoke
        # exactly the version wrangler.toml targets.
        #
        # Everything is teed to a file and uploaded as an artifact. The runner log for
        # this job is not retrievable from every environment, and guessing at a failure
        # with no output is how the previous three attempts were wasted.
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          {
            echo "=== node/npm ==="
            node --version || true
            npm --version || true
            echo "=== existing package.json ==="
            cat package.json || true
            echo "=== npm install wrangler@4.157.0 ==="
            npm install --no-save --no-audit --no-fund wrangler@4.157.0 2>&1
            echo "install exit=$?"
            echo "=== node_modules/.bin ==="
            ls -la node_modules/.bin/ 2>&1 | head -30 || true
            echo "=== version ==="
            ./node_modules/.bin/wrangler --version 2>&1 || true
          } 2>&1 | tee .ci-logs/wrangler-install.log
          WRANGLER="$(pwd)/node_modules/.bin/wrangler"
          if [ ! -x "$WRANGLER" ]; then
            echo "::error::wrangler did not install at $WRANGLER - see the wrangler-install-log artifact"
            exit 1
          fi
          echo "WRANGLER=$WRANGLER" >> "$GITHUB_ENV"
          "$WRANGLER" --version

      
      # ============ STEP 1: BACKUP FIREBASE ============
      - name: Setup Firebase Service Account
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          echo "${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}" > service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json" >> $GITHUB_ENV
      
      - name: Run Firebase Backup
        id: backup
        continue-on-error: true
        run: |
          echo "Starting Firebase backup..."
          if [ -f "service-account.json" ]; then
            python3 scripts/backup_firebase.py
            BACKUP_DIR=$(ls -td scripts/backups/*/ | head -1)
            echo "BACKUP_DIR=$BACKUP_DIR" >> $GITHUB_OUTPUT
            
            # Show backup summary
            cat "$BACKUP_DIR/BACKUP_SUMMARY.json" | jq .
          else
            echo "⚠ No Firebase service account found, skipping backup"
            echo "BACKUP_DIR=" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Backup Artifact
        if: steps.backup.outputs.BACKUP_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: firebase-backup-${{ github.run_id }}
          path: ${{ steps.backup.outputs.BACKUP_DIR }}
          retention-days: 30
      
      # ============ STEP 2: SCHEMA + MIGRATION TOKEN ============
      #
      # The previous version of this section deployed three modules
      # (data-api.js, migration-api.js, presence-realtime.js) as separate workers.
      # None of them has an `export default { fetch }`, so wrangler could not deploy
      # any of them; and `d1 migrations apply friendbook` named a database that does
      # not exist (the binding is friendbook-db). Every one of those steps also had
      # continue-on-error, so the workflow stayed green while doing nothing.
      #
      # The modules are already routed inside the main worker by deploy-cloudflare.yml,
      # so all that is needed here is the schema and the migration token.
      - name: Apply D1 schema to the remote database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # The account id is public (it is in wrangler.toml and every worker URL), so a
          # missing secret must not block schema application.
          FALLBACK_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not available to this workflow.'
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-$FALLBACK_ACCOUNT_ID}"

          # Prove the credential can reach this account before guessing at a failure.
          code=$(curl --silent --show-error --max-time 30 -o /tmp/d1.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || echo 000)
          echo "D1 list API -> HTTP $code"
          case "$code" in
            200) python3 -c "import json;d=json.load(open('/tmp/d1.json'));print('databases:',[x.get('name') for x in d.get('result',[])])" ;;
            403|401) echo '::error::CLOUDFLARE_API_TOKEN cannot list D1 databases for this account. It needs the D1:Edit permission on account 92f3d04598822de2e49e14561218d090.'; head -c 300 /tmp/d1.json; exit 1 ;;
            000) echo '::error::Could not reach the Cloudflare API from the runner.'; exit 1 ;;
            *) echo "::warning::Unexpected status $code from the D1 list API; continuing to the migrations command."; head -c 300 /tmp/d1.json ;;
          esac

          # --remote matters: without it wrangler only touches a local .sqlite file and
          # the production database stays empty while the run looks successful.
          "$WRANGLER" d1 migrations apply friendbook-db --remote 2>&1 | tee /tmp/d1-apply.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" != '0' ]; then
            echo "::error::wrangler d1 migrations apply failed with exit $RC. Last lines:"
            tail -n 25 /tmp/d1-apply.log
          fi
          exit $RC

      - name: Make sure the worker has a migration token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          FALLBACK_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
          SECRET_TOKEN: ${{ secrets.MIGRATION_ADMIN_TOKEN }}
        run: |
          set -o pipefail
          # wrangler needs the account when the token can reach more than one, and a
          # missing CF_ACCOUNT_ID secret must not silently send the secret elsewhere.
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-$FALLBACK_ACCOUNT_ID}"
          echo "Using Cloudflare account: $CLOUDFLARE_ACCOUNT_ID"

          # The worker refuses to serve /v1/admin/migrate without a token of at least 32
          # characters (fails closed). If the owner has not stored one, generate a fresh
          # token for this run so the migration can proceed without them having to create
          # and paste a secret. A stored secret always wins.
          if [ -n "$SECRET_TOKEN" ]; then
            T="$SECRET_TOKEN"
            echo 'Using MIGRATION_ADMIN_TOKEN from repository secrets.'
          else
            T=$(openssl rand -hex 32)
            echo 'MIGRATION_ADMIN_TOKEN is not in repository secrets; generated an ephemeral one for this run.'
            echo 'To keep it stable, add a repository secret named MIGRATION_ADMIN_TOKEN (openssl rand -hex 32).'
          fi
          if [ "${#T}" -lt 32 ]; then
            echo '::error::MIGRATION_ADMIN_TOKEN must be at least 32 characters.'
            exit 1
          fi
          echo "::add-mask::$T"
          echo "TOKEN=$T" >> "$GITHUB_ENV"

          # Push it onto the worker. Output is captured rather than streamed, because
          # `wrangler secret put` can exit 0 while the upload failed, and a silent
          # failure here shows up much later as a confusing 503 from the worker.
          #
          # A newline is sent with the value: wrangler reads the secret from stdin and
          # without a terminating newline it can store an empty or truncated value while
          # still exiting 0.
          mkdir -p .ci-logs
          B=https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev
          fingerprint=$(printf '%s' "$T" | sha256sum | cut -c1-16)
          echo "token fingerprint (sha256, first 16): $fingerprint"

          probe() {
            curl --silent --max-time 30 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $T" "$B/v1/admin/migrate/verify" || echo 000
          }

          for attempt in 1 2; do
            set +e
            printf '%s\n' "$T" | "$WRANGLER" secret put MIGRATION_ADMIN_TOKEN \
              --name rough-firefly-dd7b > .ci-logs/secret-put.log 2>&1
            RC=$?
            set -e
            sed -e "s/$T/***REDACTED***/g" .ci-logs/secret-put.log | tail -n 20
            echo "secret put attempt $attempt -> exit $RC"
            [ "$RC" != '0' ] && continue

            # Secrets take a moment to propagate to the edge; retry before declaring failure.
            for i in 1 2 3 4 5; do
              code=$(probe)
              echo "  probe $i -> $code"
              [ "$code" = '200' ] && break
              sleep 6
            done
            [ "$code" = '200' ] && break
            echo "  attempt $attempt did not take effect (last probe $code); retrying."
          done

          echo "$fingerprint" > .ci-logs/token-fingerprint.txt

          if [ "$code" != '200' ]; then
            case "$code" in
              401|403) echo "::error::The worker has a different migration token than the one generated here. Store MIGRATION_ADMIN_TOKEN as a repository secret so the same value is used, or delete the worker secret and re-run." ;;
              503) echo '::error::The worker reports no migration token even after two uploads.' ;;
              *) echo "::error::/v1/admin/migrate is not reachable (HTTP $code). Deploy the worker first." ;;
            esac
            exit 1
          fi
          echo 'Migration token installed on the worker and accepted by it.'
          echo 'TOKEN_OK=true' >> "$GITHUB_ENV"

      # ============ STEP 3: RUN MIGRATION ============
      - name: Confirm the worker routes are live before touching data
        run: |
          B=https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev
          code=$(curl --silent --show-error --max-time 30 -o /tmp/v.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$B/v1/admin/migrate/verify" || echo 000)
          echo "migrate/verify -> $code (token fingerprint $(sha256sum <<< "$TOKEN" | cut -c1-16))"
          case "$code" in
            200) echo 'Migration API is live and the token is accepted.' ;;
            401|403) echo '::error::The worker rejected the migration token.'; exit 1 ;;
            503) echo '::error::The worker has no migration token configured; the previous step did not take effect.'; exit 1 ;;
            *) echo "::error::/v1/admin/migrate is not routed (HTTP $code). Deploy the worker first: Actions -> Deploy existing Cloudflare Worker."; exit 1 ;;
          esac

      - name: Run Firestore to D1 Migration
        env:
          CF_API_BASE: https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/admin/migrate
          # The workflow-level env maps CF_API_TOKEN to secrets.CLOUDFLARE_API_TOKEN, which is
          # the Cloudflare *management* token, not the worker's migration bearer. The script
          # sends this value in an Authorization header to /v1/admin/migrate, so it has to be
          # the token the previous step installed. Overriding here is the whole fix for the
          # exit-4 failure.
          CF_API_TOKEN: ${{ env.TOKEN }}
        run: |
          # No "skip if no token" branch: the script fails closed on its own and exits
          # non-zero, and this step must not report success for a run that copied nothing.
          mkdir -p .ci-logs
          echo '::notice::migration step started'
          # GitHub runs this shell with -e, so a non-zero python exit would abort the step
          # before the diagnostics below ever ran. That is exactly why the previous
          # failures produced no output.
          set +e
          python3 -u scripts/migrate_firestore_to_d1.py > .ci-logs/migration.log 2>&1
          RC=$?
          set -e
          echo "migration script exit=$RC"
          echo "--- last 20 lines ---"
          tail -n 20 .ci-logs/migration.log || true
          if [ "$RC" != '0' ]; then
            msg=$(tail -n 8 .ci-logs/migration.log | tr '\n' ' | ' | cut -c1-400)
            echo "::error::Migration failed (exit $RC): $msg"
          fi
          exit $RC

      # ============ STEP 4: VERIFY MIGRATION ============
      - name: Verify Migration
        id: verify
        env:
          CF_API_BASE: https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/admin/migrate
          CF_API_TOKEN: ${{ env.TOKEN }}
        run: |
          python3 scripts/verify_migration.py
          
          # Extract report
          REPORT_FILE=$(ls -t scripts/migration_report_*.json 2>/dev/null | head -1)
          if [ -n "$REPORT_FILE" ]; then
            echo "REPORT_FILE=$REPORT_FILE" >> $GITHUB_OUTPUT
            cat "$REPORT_FILE" | jq .
          else
            echo "REPORT_FILE=" >> $GITHUB_OUTPUT
          fi
      
      # Runs even when an earlier step failed, so the reason is always retrievable.
      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}-${{ github.job }}
          path: .ci-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Migration Report
        if: steps.verify.outputs.REPORT_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: migration-report-${{ github.run_id }}
          path: ${{ steps.verify.outputs.REPORT_FILE }}
          retention-days: 30
      
      # ============ STEP 5: ENABLE CLOUDFLARE DATA (if verified) & BUILD APK ============
      - name: Enable Cloudflare Data in Build Config (if migration verified)
        if: steps.verify.outputs.REPORT_FILE != ''
        run: |
          # Check if migration was successful
          REPORT=$(cat ${{ steps.verify.outputs.REPORT_FILE }})
          VERIFIED=$(echo $REPORT | jq -r '.verified')
          FIRESTORE_TOTAL=$(echo $REPORT | jq -r '.totals.firestore')
          D1_TOTAL=$(echo $REPORT | jq -r '.totals.d1')
          
          echo "Verification: $VERIFIED"
          echo "Firestore Total: $FIRESTORE_TOTAL"
          echo "D1 Total: $D1_TOTAL"
          
          if [ "$VERIFIED" = "true" ] && [ "$FIRESTORE_TOTAL" = "$D1_TOTAL" ] && [ "$FIRESTORE_TOTAL" -gt 0 ]; then
            echo "✅ Migration verified! Enabling CLOUDFLARE_DATA_ENABLED..."
            sed -i "s/buildConfigField 'boolean', 'CLOUDFLARE_DATA_ENABLED', 'false'/buildConfigField 'boolean', 'CLOUDFLARE_DATA_ENABLED', 'true'/" app/build.gradle
            cat app/build.gradle | grep CLOUDFLARE_DATA_ENABLED
          else
            echo "❌ Migration verification FAILED!"
            echo "Verification status: $VERIFIED"
            echo "Firestore: $FIRESTORE_TOTAL, D1: $D1_TOTAL"
            exit 1
          fi
      
      - name: Bump Version
        run: |
          # Increment version code
          CURRENT_CODE=$(grep versionCode app/build.gradle | head -1 | sed 's/.*versionCode //')
          NEW_CODE=$((CURRENT_CODE + 1))
          NEW_NAME="2.8.$((89 + NEW_CODE - 121))"
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" app/build.gradle
          sed -i "s/versionName '2.8.89'/versionName '$NEW_NAME'/" app/build.gradle
          echo "New version: $NEW_NAME ($NEW_CODE)"
          echo "VERSION_NAME=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$NEW_CODE" >> $GITHUB_OUTPUT
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
    
      - name: Ensure Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 2>/dev/null || true)"
          if [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "android-36 platform already installed"
          elif [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" || \
              echo "::warning::sdkmanager install failed; trying to continue with preinstalled SDK"
          else
            echo "::warning::sdkmanager not found; using preinstalled SDK"
          fi
    
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
    
      - name: Build Signed Release APK + AAB
        id: rel
        run: |
          set +e
          for VER in "15-robolectric-12650502-i7" "9-robolectric-4913185-2-i7"; do
            DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$VER"
            JAR="$DIR/android-all-instrumented-$VER.jar"
            if [ ! -s "$JAR" ]; then
              mkdir -p "$DIR"
              curl -fsSL --retry 6 --retry-delay 3 --retry-all-errors \
                "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$VER/android-all-instrumented-$VER.jar" \
                -o "$JAR.tmp" && mv "$JAR.tmp" "$JAR"
            fi
          done
          gradle testReleaseUnitTest bundleRelease assembleRelease --console=plain > build-release.log 2>&1
          RC=$?
          if [ "$RC" != "0" ]; then
            echo "Retrying Gradle build after transient artifact fetch..."
            sleep 5
            gradle testReleaseUnitTest bundleRelease assembleRelease --rerun-tasks --console=plain > build-release.log 2>&1
            RC=$?
          fi
          echo "exit=$RC" >> "$GITHUB_OUTPUT"
          exit 0
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friendbook-apk-${{ steps.bump.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
      
      - name: Surface bounded unit-test failure details
        if: steps.rel.outputs.exit != '0'
        run: python3 scripts/ci/report_android_failure.py
    
      - name: Surface compiler errors as annotations
        if: steps.rel.outputs.exit != '0'
        run: |
          echo "===== javac error blocks (with symbol details) ====="
          grep -A8 -E "\.java:[0-9]+: error:" build-release.log | head -120 | while IFS= read -r line; do
            echo "::error::${line:0:250}"
          done
          echo "===== failing source lines ====="
          grep -oE "^/[^ ]+\.java:[0-9]+: error:" build-release.log | sort -u | while IFS= read -r hit; do
            f="${hit%%:*}"; ln="$(echo "$hit" | cut -d: -f2)"
            content=$(sed -n "${ln}p" "$f")
            echo "::error file=$f,line=$ln,title=source::${content:0:250}"
          done
          echo "===== aapt/resource errors ====="
          grep -Ei "aapt|resource|merge|duplicate" build-release.log | grep -Ei "error|failed" | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "===== gradle tail (as warnings so we can read them) ====="
          grep -vE "^$" build-release.log | tail -60 | while IFS= read -r line; do
            echo "::warning::${line:0:300}"
          done
    
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friendbook-aab-${{ steps.bump.outputs.VERSION_NAME }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
      
      # ============ STEP 6: CREATE RELEASE ============
      - name: Create GitHub Release
        if: steps.rel.outputs.exit == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.VERSION_NAME }}
          name: "friendbook v${{ steps.bump.outputs.VERSION_NAME }} (Cloudflare Migration Ready)"
          body: |
            ## 🔄 Firebase → Cloudflare Migration Status
            
            ### Migration Report
            ${{ steps.verify.outputs.REPORT_FILE != '' && format('\n            - **Firestore Users**: {0}\n            - **D1 Users**: {1}\n            - **Status**: ✅ 100% Match Verified\n            ', steps.verify.outputs.FIRESTORE_TOTAL, steps.verify.outputs.D1_TOTAL) || format('\n            - **Migration**: Not completed (missing Cloudflare secrets)\n            - **Missing Secrets**: {0}\n            - **CLOUDFLARE_DATA_ENABLED**: false (default)\n            ', steps.cf_secrets.outputs.MISSING_SECRETS) }}
            
            ### What's Ready
            - ✅ CfClient.java - Cloudflare Workers API client
            - ✅ Cloudflare Workers (data-api.js, migration-api.js, presence-realtime.js)
            - ✅ D1 Schema (migration 0014_additive_core_schema.sql)
            - ✅ Migration scripts (backup, migrate, verify)
            - ✅ CLOUDFLARE_DATA_ENABLED build flag (currently false)
            
            ### What's Unchanged (Free Firebase Services)
            - ✅ Firebase Auth (Email, Phone OTP, Google, Apple)
            - ✅ FCM (Push Notifications)
            - ✅ Crashlytics
            - ✅ Analytics
            - ✅ Remote Config
            - ✅ App Check (Play Integrity - MONITOR mode)
            
            ### To Complete Migration
            1. Add missing Cloudflare secrets to GitHub: ${{ steps.cf_secrets.outputs.MISSING_SECRETS || 'none' }}
            2. Run this workflow again
            3. Verify migration report shows 100% match
            4. CLOUDFLARE_DATA_ENABLED will be set to true automatically
          
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}