# A capped, aggregate-only lookup; no mutation or record values.
name: Historical comment route aggregate preflight
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths: [.github/workflows/comment-route-preflight.yml, scripts/loadtest/comment_route_preflight.py, scripts/tests/test_comment_route_preflight.py]
permissions:
  contents: read
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[comment-route-preflight]') && contains(github.event.head_commit.message, '[allow-production-scans]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts.tests.test_comment_route_preflight -v
      - name: Capped aggregate only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/comment_route_preflight.py
