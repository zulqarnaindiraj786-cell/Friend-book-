# Targeted demand fix: add only the reviewed friendship-facts and video-post indexes, then deploy.
# Never execute the full migration chain or remove existing indexes/data.
name: Deploy bounded demand quota fixes
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths:
      - '.github/workflows/deploy-demand-quota-fixes.yml'
      - 'scripts/admin/verify_worker_rollout.py'
permissions:
  contents: read
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-demand-quota]' )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full local regressions before deployment
        run: |
          npm test
          python3 -m unittest discover -s scripts/tests
          python3 cloudflare/test/schema_test.py
          python3 cloudflare/test/migration_test.py
          python3 cloudflare/test/index_plan_test.py
          QUOTA_EXPERIMENT_FRIEND_INDEXES=1 node scripts/loadtest/d1_quota_replay.mjs 30 > /tmp/quota-preview-replay.json
      - name: Refuse unless live configuration matches and rollback version is recorded
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/admin/verify_worker_rollout.py --snapshot /tmp/quota-rollout-before.json
      - name: Compile exact production config without deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.157.0 deploy --dry-run --outdir /tmp/quota-code-bundle
      - name: Install only the reviewed additive friendship and video indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.157.0 d1 execute friendbook-db --remote --file cloudflare/migrations/0094_friend_membership_facts.sql
          npx --yes wrangler@4.157.0 d1 execute friendbook-db --remote --file cloudflare/migrations/0095_video_post_page.sql
          npx --yes wrangler@4.157.0 d1 execute friendbook-db --remote --command "EXPLAIN QUERY PLAN SELECT path FROM friendbook_cf_firestore_documents INDEXED BY idx_cf_friend_valid_pair WHERE parent_path='friends' AND json_type(document_json,'$.participants')='array' AND json_array_length(document_json,'$.participants')=2 AND json_extract(document_json,'$.participants[0]')='__quota_probe__' AND json_extract(document_json,'$.participants[1]')='__quota_probe_other__'"
          npx --yes wrangler@4.157.0 d1 execute friendbook-db --remote --command "EXPLAIN QUERY PLAN SELECT path FROM friendbook_cf_firestore_documents INDEXED BY idx_cf_video_post_page WHERE parent_path='posts' AND json_extract(document_json,'$.mediaType')='video' AND doc_id>'__quota_probe__' ORDER BY doc_id LIMIT 5"
          npx --yes wrangler@4.157.0 d1 execute friendbook-db --remote --command "EXPLAIN QUERY PLAN SELECT doc_id FROM friendbook_cf_firestore_documents INDEXED BY idx_cf_video_post_exceptions WHERE parent_path='posts' AND json_extract(document_json,'$.mediaType')='video' AND (doc_id='' OR doc_id GLOB '*[^ -~]*' OR instr(doc_id,char(0))>0 OR instr(doc_id,'/')>0 OR path<>'posts/'||doc_id) LIMIT 1"
      - name: Deploy Worker code after the indexes are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.157.0 deploy --keep-vars
      - name: Verify resource preservation and smoke health and auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/admin/verify_worker_rollout.py --snapshot /tmp/quota-rollout-before.json --compare
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base='https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'FriendBook-Code-Rollout/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as e: return e.code,{}
          status,health=get('/health')
          assert status==200 and health.get('ok') is True and health.get('d1InteractionsEnabled') is True
          assert health['views']['ae'] is True
          assert get('/v1/me')[0]==401
          print('Health 200, D1 enabled, Analytics Engine bound, unauthenticated API 401.')
          PY
      - name: Preserve rollback metadata and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quota-code-rollout-evidence
          path: |
            /tmp/quota-rollout-before.json
            /tmp/quota-preview-replay.json
          retention-days: 7

# Owner-requested rollout; both index-build and rollback gates remain mandatory.
