name: Run D1 document rebuild (D1 API, gated)

# Converts D1's normalised rows into the app document store through the D1 REST API.
#
# Why this runner and not the Worker route: /v1/admin/migrate/documents/* is gated behind
# MIGRATION_ADMIN_TOKEN, which is not a repository secret. CLOUDFLARE_API_TOKEN is, and
# scripts/d1_coverage.py already reads this database with it. The mapping and the gate are
# the same code paths as the Worker module (scripts/tests/test_rebuild_mapping_parity.py
# asserts both produce identical documents).
#
# Triggered by a committed request file, so ordinary pushes do nothing:
#   cloudflare/test/d1-rebuild-request.json
#   { "step": "none" | "flow" | "plan" | "dry-run" | "verify",
#     "collection": "posts", "apply": false, "confirm": "APPLY", "note": "..." }
#
# "flow" without apply is read-only (plan + posts dry run + checks).
# "flow" with apply:true AND confirm:APPLY writes documents, and only after the plan and
# the posts dry run pass.

on:
  push:
    branches: ['arena/**']
    paths: ['cloudflare/test/d1-rebuild-request.json']
  workflow_dispatch:
    inputs:
      step:
        description: 'none | flow | plan | dry-run | verify'
        required: true
        default: none
        type: string

permissions:
  contents: read
  # The result is posted back as a comment: Actions logs live on a host that tooling
  # outside the runner cannot always reach, but an issue comment is readable everywhere.
  issues: write
  pull-requests: write

concurrency:
  group: friendbook-d1-document-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '92f3d04598822de2e49e14561218d090' }}
      D1_DATABASE_ID: e1c605ca-a50b-46c6-9deb-56dd1f70d163
      REQUEST_FILE: cloudflare/test/d1-rebuild-request.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read the request
        id: request
        env:
          DISPATCH_STEP: ${{ inputs.step }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          step = (os.environ.get('DISPATCH_STEP') or '').strip()
          data = {}
          path = pathlib.Path(os.environ['REQUEST_FILE'])
          if path.exists():
              data = json.loads(path.read_text())
          if not step:
              step = str(data.get('step') or 'none')
          collection = str(data.get('collection') or 'posts')
          apply_writes = bool(data.get('apply')) and data.get('confirm') == 'APPLY'
          print(f"step={step}")
          print(f"collection={collection}")
          print(f"apply={'true' if apply_writes else 'false'}")
          print(f"note={str(data.get('note') or '')[:200]}")
          PY

      - name: Nothing requested
        if: steps.request.outputs.step == 'none'
        run: |
          echo "step=none — no database work requested."
          echo "### No work requested" >> "$GITHUB_STEP_SUMMARY"

      - name: Offline mapping parity and runner tests (no network)
        if: steps.request.outputs.step != 'none'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_rebuild_mapping_parity.py'
          python3 -m unittest discover -s scripts/tests -p 'test_document_rebuild_tool.py'

      - name: Run the request
        id: work
        if: steps.request.outputs.step != 'none'
        continue-on-error: true
        run: |
          set +e
          STEP="${{ steps.request.outputs.step }}"
          APPLY="${{ steps.request.outputs.apply }}"
          COLLECTION="${{ steps.request.outputs.collection }}"
          case "$STEP" in
            flow)
              if [ "$APPLY" = "true" ]; then
                python3 scripts/admin/rebuild_documents_d1.py flow --apply > rebuild-output.json 2> rebuild-error.log
              else
                python3 scripts/admin/rebuild_documents_d1.py flow > rebuild-output.json 2> rebuild-error.log
              fi ;;
            plan)
              python3 scripts/admin/rebuild_documents_d1.py plan > rebuild-output.json 2> rebuild-error.log ;;
            dry-run)
              python3 scripts/admin/rebuild_documents_d1.py run "$COLLECTION" > rebuild-output.json 2> rebuild-error.log ;;
            verify)
              python3 scripts/admin/rebuild_documents_d1.py verify "$COLLECTION" > rebuild-output.json 2> rebuild-error.log ;;
            *)
              echo "unknown step: $STEP" > rebuild-error.log
              false ;;
          esac
          CODE=$?
          echo "$CODE" > rebuild-exit.txt
          echo "step=$STEP apply=$APPLY collection=$COLLECTION exit=$CODE"
          test -f rebuild-output.json && cat rebuild-output.json
          test -f rebuild-error.log && cat rebuild-error.log >&2
          exit 0

      - name: Worker health (read-only HTTP check)
        if: always() && steps.request.outputs.step != 'none'
        run: |
          URL="https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/health"
          CODE=$(curl -sS -o health-body.json -w '%{http_code}' --max-time 30 "$URL" || echo 000)
          echo "$CODE" > health-code.txt
          head -c 600 health-body.json > health-body.txt 2>/dev/null || true
          echo "GET $URL -> $CODE"
          cat health-body.txt 2>/dev/null || true

      - name: Publish the result
        if: always() && steps.request.outputs.step != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEP: ${{ steps.request.outputs.step }}
          APPLY: ${{ steps.request.outputs.apply }}
        run: |
          {
            echo "### D1 rebuild: ${STEP} (apply=${APPLY})"
            echo ""
            if [ -f rebuild-output.json ]; then
              echo '```json'
              head -c 52000 rebuild-output.json
              echo '```'
            else
              echo '_no output file produced_'
            fi
            if [ -s rebuild-error.log ]; then
              echo ''
              echo '**stderr**'
              echo '```'
              head -c 4000 rebuild-error.log
              echo '```'
            fi
            echo ''
            echo "exit=$(cat rebuild-exit.txt 2>/dev/null || echo missing)"
            echo ''
            echo "**GET /v1/health -> $(cat health-code.txt 2>/dev/null || echo missing)**"
            if [ -s health-body.txt ]; then
              echo '```json'
              head -c 600 health-body.txt
              echo '```'
            fi
            echo "commit=${{ github.sha }}"
          } > result-comment.md
          cat result-comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment 31 --repo "$GITHUB_REPOSITORY" --body-file result-comment.md             || gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file result-comment.md             || echo "::warning::could not post the result comment"

      - name: Fail if the request failed
        if: always() && steps.request.outputs.step != 'none'
        run: |
          CODE=$(cat rebuild-exit.txt 2>/dev/null || echo 1)
          echo "recorded exit=$CODE"
          test "$CODE" = "0"
