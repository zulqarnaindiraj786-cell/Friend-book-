# Aggregate only: no identifiers, test pushes or production changes.
name: FCM claim storage preflight
on:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths: [.github/workflows/fcm-claim-preflight.yml, scripts/loadtest/fcm_claim_preflight.py]
permissions:
  contents: read
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[fcm-claim-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bounded claim count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/fcm_claim_preflight.py
