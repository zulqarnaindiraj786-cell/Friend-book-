# Read-only checks after the guarded Worker-only upload: no schema change, no
# retired table touched, presence routes gone, no cron, normal API still serving.
name: Post-upload verification
on:
  workflow_dispatch:
  push:
    branches: ['arena/7c7ddb7b-friend-book']
    paths: ['.github/workflows/post-deploy-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[post-deploy-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
      BASE: https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: HTTP status of removed and normal routes
        run: |
          for path in /v1/presence/me /v1/presence/contact/peer /v1/presence/typing/room /v1/presence/socket /v1/android-config /v1/firestore/query; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$path" || echo 000)
            echo "::notice::$path -> $code"
          done
      - name: The migration list still shows 0086 unapplied
        run: |
          npx --yes wrangler@4.157.0 d1 migrations list friendbook-db --remote > migrations.log 2>&1 || true
          grep -E '[0-9]{4}_[A-Za-z0-9_]+\.sql' migrations.log | sed 's/^/pending: /' || echo 'no pending migrations reported'
          if grep -q '0086_remove_unused_status_tables.sql' migrations.log; then
            echo '::notice::0086 is still pending, so the seven-table DROP has not run.'
          else
            echo '::error::0086 is no longer pending; the DROP may have run.'
            exit 1
          fi
      - name: The seven retired tables still exist
        run: |
          npx --yes wrangler@4.157.0 d1 execute friendbook-db --remote --json --command \
            "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('friendbook_cf_presence','friendbook_cf_presence_sessions','friendbook_cf_presence_sessions_copy','friendbook_cf_presence_sessions_fullcopy','friendbook_cf_typing','friendbook_cf_typing_sessions','friendbook_cf_typing_sessions_fullcopy') ORDER BY name" \
            > tables.json 2>tables.err || { cat tables.err; exit 1; }
          python3 - <<'PY'
          import json
          data = json.load(open('tables.json'))
          rows = (data[0].get('results') if isinstance(data, list) else data.get('results')) or []
          names = sorted(row.get('name') for row in rows)
          print('::notice::retired tables still present: ' + json.dumps({'count': len(names), 'names': names}))
          # The three "*copy" tables never existed in production: the earlier
          # preflight counted 1 + 4,690 + 1 + 311 = 5,003 rows, so those three
          # contributed zero rows rather than a table.
          required = {'friendbook_cf_presence', 'friendbook_cf_presence_sessions',
                      'friendbook_cf_typing', 'friendbook_cf_typing_sessions'}
          missing = sorted(required - set(names))
          if missing:
              raise SystemExit('Retired tables disappeared without a migration: ' + ', '.join(missing))
          PY
      - name: Two-minute sample of presence routes and cron invocations
        run: |
          python3 - <<'PY'
          import collections, json, os, select, signal, subprocess, time, urllib.parse
          p = subprocess.Popen(['npx', '--yes', 'wrangler@4.157.0', 'tail', 'rough-firefly-dd7b', '--format', 'json'],
                               stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, start_new_session=True)
          deadline = time.monotonic() + 120
          buffer, decoder = '', json.JSONDecoder()
          counters = {'http': 0, 'cron': 0, 'presence': collections.Counter()}
          def handle(obj):
              if isinstance(obj, list):
                  for item in obj:
                      handle(item)
                  return
              if not isinstance(obj, dict):
                  return
              details = obj.get('event') or {}
              request = details.get('request') if isinstance(details, dict) else None
              if isinstance(request, dict) and isinstance(request.get('url'), str):
                  counters['http'] += 1
                  path = urllib.parse.urlsplit(request['url']).path
                  if path.startswith('/v1/presence/'):
                      counters['presence'][str((details.get('response') or {}).get('status'))] += 1
              elif details.get('cron') or obj.get('cron'):
                  counters['cron'] += 1
          try:
              while time.monotonic() < deadline:
                  ready, _, _ = select.select([p.stdout], [], [], 1)
                  if not ready:
                      if p.poll() is not None:
                          break
                      continue
                  chunk = os.read(p.stdout.fileno(), 65536)
                  if not chunk:
                      break
                  buffer += chunk.decode('utf-8', 'replace')
                  while buffer:
                      starts = [i for i in (buffer.find('{'), buffer.find('[')) if i >= 0]
                      if not starts:
                          buffer = ''
                          break
                      buffer = buffer[min(starts):]
                      try:
                          obj, end = decoder.raw_decode(buffer)
                      except ValueError:
                          if len(buffer) > 1048576:
                              buffer = ''
                          break
                      buffer = buffer[end:]
                      handle(obj)
          finally:
              try:
                  os.killpg(p.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  p.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  os.killpg(p.pid, signal.SIGKILL)
                  p.wait()
          print('::notice::two-minute sample: ' + json.dumps({'http_events': counters['http'],
              'presence_route_statuses': dict(counters['presence']), 'cron_invocations': counters['cron']}))
          if counters['cron']:
              raise SystemExit('Cron invocations observed after the upload.')
          bad = [s for s in counters['presence'] if s not in ('404', 'None')]
          if bad:
              raise SystemExit('Presence routes answered with ' + ','.join(sorted(bad)))
          print('::notice::No cron invocation and no live presence route in this window.')
          PY
