# Read-only aggregate diagnosis for a canonical mirror that reappeared after retirement.
name: Read-only canonical mirror diff
on:
  workflow_dispatch:
permissions: {}
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compare retained snapshot to current mirror (aggregate counts only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 -m scripts.loadtest.verify_canonical_mirror_retirement --diff
