# A capped, aggregate-only SQL read. No migration, app traffic, or user values.
name: Legacy comment aggregate preflight
on:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths: [.github/workflows/legacy-comment-preflight.yml, scripts/loadtest/legacy_comment_preflight.py]
permissions:
  contents: read
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[legacy-comment-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read capped aggregate without logging records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/legacy_comment_preflight.py
