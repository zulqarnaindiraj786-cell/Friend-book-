name: Read-only D1 loading diagnostic
on:
  push:
    branches: ['arena/f6bf61bd-friend-book']
    paths: ['.github/workflows/d1-load-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: "contains(github.event.head_commit.message, '[d1-load-diagnostic]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Count feed sort compatibility without revealing records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -eu
          sql="SELECT 'canonical' AS source, COUNT(*) AS total, SUM(CASE WHEN (json_type(document_json,'\$.createdAt') IN ('integer','real') OR (json_extract(document_json,'\$.createdAt.__type')='timestamp' AND json_type(document_json,'\$.createdAt.millis')='integer')) THEN 0 ELSE 1 END) AS nonstandard FROM friendbook_cf_firestore_documents WHERE parent_path='posts' UNION ALL SELECT 'legacy',COUNT(*),SUM(CASE WHEN (json_type(document_json,'\$.createdAt') IN ('integer','real') OR (json_extract(document_json,'\$.createdAt.__type')='timestamp' AND json_type(document_json,'\$.createdAt.millis')='integer')) AND json_type(document_json,'\$.fields') IS NOT 'object' THEN 0 ELSE 1 END) FROM friendbook_cf_documents WHERE collection='posts';"
          npx --yes wrangler@4.157.0 d1 execute friendbook-db --remote --json --command "$sql" > diagnostic.json
          node -e "const d=require('./diagnostic.json'); for(const r of d[0].results) console.log('::notice title=D1 feed aggregate::'+r.source+' total='+r.total+' nonstandard='+r.nonstandard)"
      - name: Verify real D1 engagement and document reads without modifying data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/admin/check_live_engagement_d1.mjs
