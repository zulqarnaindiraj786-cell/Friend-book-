name: Cleanup Actions artifacts (frees storage quota)

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 0'   # weekly: build artifacts must never fill the account again

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every Actions artifact (they are regeneratable build outputs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          deleted=0
          while true; do
            ids=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100" \
              | python3 -c 'import json,sys; print("\n".join(str(a["id"]) for a in json.load(sys.stdin).get("artifacts", [])))')
            [ -z "$ids" ] && break
            for id in $ids; do
              curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$id" > /dev/null
              deleted=$((deleted+1))
            done
            echo "deleted so far: $deleted"
          done
          echo "total deleted: $deleted"
