name: Read-only D1 migration inventory
on:
  push:
    branches: ['arena/f6bf61bd-friend-book']
    paths: ['.github/workflows/firestore-copy-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aggregate D1 inventory only (zero Firebase reads and no data writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          SQL="SELECT json_object('archived_documents',(SELECT COUNT(*) FROM friendbook_cf_fullcopy_archive),'collections_complete',(SELECT COUNT(*) FROM friendbook_cf_fullcopy_queue WHERE status='complete'),'collections_pending',(SELECT COUNT(*) FROM friendbook_cf_fullcopy_queue WHERE status='pending'),'reserved_units',(SELECT reserved FROM friendbook_cf_copy_read_budget ORDER BY quota_day DESC LIMIT 1),'daily_cap',(SELECT cap FROM friendbook_cf_copy_read_budget ORDER BY quota_day DESC LIMIT 1)) AS inventory;"
          npx --yes wrangler@4.157.0 d1 execute friendbook-db --remote --command "$SQL" --json > "$RUNNER_TEMP/inventory.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/inventory.json') as f: data=json.load(f)
          rows=[r for result in data for r in result.get('results',[]) if 'inventory' in r]
          if len(rows)!=1: raise SystemExit('Expected one aggregate inventory row')
          inventory=json.loads(rows[0]['inventory'])
          print('::notice::D1_AGGREGATE_INVENTORY='+json.dumps(inventory,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## D1-only migration inventory\nNo Firebase reads or data writes.\n\n```json\n'+json.dumps(inventory,indent=2,sort_keys=True)+'\n```\n')
          PY

# Audit is read-only and does not invoke Firebase.

