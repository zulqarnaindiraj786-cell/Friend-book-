# Explicitly requested aggregate-only investigation. Never migrates or deploys.
name: Read-only friendship index preflight
on:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths:
      - '.github/workflows/friend-guard-preflight.yml'
      - 'scripts/loadtest/friend_guard_index_preflight.py'
      - 'scripts/tests/test_friend_guard_index_preflight.py'
permissions: {}
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[friend-index-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test bounds and aggregate privacy locally
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_friend_guard_index_preflight.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_d1_account_usage_analytics.py' -v
      - name: Require conservative account analytics headroom before the D1 query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/d1_account_usage_analytics.py --preflight-budget
      - name: Run bounded read-only aggregate (no app traffic or migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/friend_guard_index_preflight.py
