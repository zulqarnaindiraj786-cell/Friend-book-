# Costly D1 SELECTs require a separate explicit scan marker; routine audits use GraphQL.
# Never migrates or deploys. The original full-scan baseline is disabled.
name: Read-only friendship index preflight
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths:
      - '.github/workflows/friend-guard-preflight.yml'
      - 'scripts/loadtest/friend_guard_index_preflight.py'
      - 'scripts/tests/test_friend_guard_index_preflight.py'
      - 'scripts/loadtest/profile_friend_guard.py'
      - 'scripts/loadtest/friend_guard_queries.mjs'
permissions: {}
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[friend-index-preflight]') && contains(github.event.head_commit.message, '[allow-production-scans]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test bounds and aggregate privacy locally
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_friend_guard_index_preflight.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_d1_account_usage_analytics.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require conservative account analytics headroom before the D1 query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/d1_account_usage_analytics.py --preflight-budget
      - name: Run bounded read-only aggregate (no app traffic or migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/profile_friend_guard.py --allow-production-scans
