name: Retain only the 15-minute Worker cron
on:
  workflow_dispatch:
  push:
    branches: ['arena/b52bc74d-friend-book']
    paths: ['.github/workflows/retain-quarter-hour-cron.yml']
permissions:
  contents: read
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Remove hourly trigger and verify 15-minute trigger remains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: 92f3d04598822de2e49e14561218d090
          SCRIPT: rough-firefly-dd7b
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['ACCOUNT']}/workers/scripts/{os.environ['SCRIPT']}/schedules"
          headers={'Authorization':f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",'Content-Type':'application/json'}
          def request(method='GET', body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          current=request().get('result',{}).get('schedules',[])
          expressions=sorted(x.get('cron') for x in current)
          expected=['*/15 * * * *','0 * * * *']
          desired=['*/15 * * * *']
          print('::notice::Before schedule list '+json.dumps(expressions))
          if expressions==expected:
              result=request('PUT',[{'cron':'*/15 * * * *'}])
              if not result.get('success'):
                  raise RuntimeError('Cloudflare rejected selective cron update: '+json.dumps(result)[:500])
          elif expressions!=desired:
              raise RuntimeError('Refusing unexpected schedule state: '+json.dumps(expressions))
          after=request().get('result',{}).get('schedules',[])
          after_expr=sorted(x.get('cron') for x in after)
          print('::notice::After schedule list '+json.dumps(after_expr))
          if after_expr!=desired:
              raise RuntimeError('Verification failed; expected only */15 * * * *')
          print('::notice::Hourly cron removed. The 15-minute cron remains.')
          PY
