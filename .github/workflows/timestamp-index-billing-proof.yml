name: Isolated timestamp-index D1 billing proof
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths:
      - '.github/workflows/timestamp-index-billing-proof.yml'
      - 'scripts/admin/prove_timestamp_index_billing.py'
      - 'scripts/tests/test_timestamp_billing_probe.py'
permissions:
  contents: read
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  billing-proof:
    if: contains(github.event.head_commit.message, '[verify-index-billing]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated ownership, cleanup and no false SQLite billing claims
        run: python3 -m unittest scripts.tests.test_timestamp_billing_probe -v
      - name: Controlled disposable-table proof (no app tables or user data)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/admin/prove_timestamp_index_billing.py --allow-isolated-two-row-probe --output /tmp/timestamp-index-billing-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timestamp-index-billing-proof
          path: /tmp/timestamp-index-billing-proof.json
          retention-days: 7
          if-no-files-found: warn
