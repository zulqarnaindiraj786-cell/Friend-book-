# Unit tests only: proves the on-demand document behaviour without shipping an APK.
name: Android unit tests
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/android-unit-tests.yml'
      - 'app/src/test/**'
      - 'app/src/main/java/com/friendbook/social/d1/**'
      - 'app/src/main/java/**'
      - 'app/build.gradle'
concurrency:
  group: friendbook-android-unit-tests
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 36
        run: |
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 2>/dev/null || true)"
          if [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "android-36 platform already installed"
          elif [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" || \
              echo "::warning::sdkmanager install failed; trying to continue with preinstalled SDK"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch and verify Robolectric Android jars before test JVM startup
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for VER in "15-robolectric-12650502-i7" "9-robolectric-4913185-2-i7"; do
            DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$VER"
            JAR="$DIR/android-all-instrumented-$VER.jar"
            URL="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/$VER/android-all-instrumented-$VER.jar"
            mkdir -p "$DIR"
            curl -fsSL --connect-timeout 15 --max-time 120 --retry 3 --retry-max-time 180 --retry-delay 3 --retry-all-errors "$URL.sha512" -o "$JAR.sha512.tmp"
            HASH="$(awk '{print $1}' "$JAR.sha512.tmp")"
            [[ "$HASH" =~ ^[a-fA-F0-9]{128}$ ]]
            if [ ! -f "$JAR" ] || ! printf '%s  %s\n' "$HASH" "$JAR" | sha512sum --check --status; then
              curl -fsSL --connect-timeout 15 --max-time 120 --retry 3 --retry-max-time 180 --retry-delay 3 --retry-all-errors "$URL" -o "$JAR.tmp"
              printf '%s  %s\n' "$HASH" "$JAR.tmp" | sha512sum --check --status
              mv "$JAR.tmp" "$JAR"
            fi
            rm "$JAR.sha512.tmp"
          done

      - name: Run JVM unit tests
        env:
          # Use Maven Central's canonical endpoint in both Gradle and its test JVMs.
          # The release workflow already uses this endpoint for Robolectric Android jars.
          JAVA_TOOL_OPTIONS: '-Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2'
        run: |
          set +e
          gradle testDebugUnitTest --console=plain > unit-tests.log 2>&1
          RESULT=$?
          grep -E "d1.documents.ListenerPollingPolicyTest|tests completed|FAILED" unit-tests.log | tail -30
          if [ "$RESULT" != "0" ]; then
            python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*ListenerDocumentFlightsTest.xml'):
              for failure in ET.parse(path).iter('failure'):
                  for line in (failure.text or '').splitlines()[:8]:
                      print('::error::Listener document regression: '+line[:350])
          PYTEST
            grep -nE "error: |FAILED|expected:|Tests? .*failed|AssertionError|Exception|Failed to fetch|Server returned HTTP" unit-tests.log \
              | head -40 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
            tail -40 unit-tests.log | while IFS= read -r line; do echo "::warning::${line:0:400}"; done
          else
            echo '::notice::On-demand document tests passed: no per-second document reads and no fixed-rate polling loops.'
          fi
          exit "$RESULT"

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: unit-test-logs
          path: |
            unit-tests.log
            app/build/reports/tests/testDebugUnitTest
          retention-days: 3
