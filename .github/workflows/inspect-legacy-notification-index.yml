# Read-only metadata and EXPLAIN plus a capped aggregate; no index mutation.
name: Inspect legacy notification index
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths: [.github/workflows/inspect-legacy-notification-index.yml, scripts/admin/retire_legacy_notification_index.py, scripts/tests/test_legacy_notification_index_retirement.py]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-legacy-notification-index]') && contains(github.event.head_commit.message, '[allow-production-scans]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts.tests.test_legacy_notification_index_retirement -v
      - name: Verify index metadata, recipient seek and capped count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/admin/retire_legacy_notification_index.py --size-preflight
