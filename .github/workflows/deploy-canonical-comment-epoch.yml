name: Deploy canonical comment epoch guard and notification mirror fix
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths:
      - '.github/workflows/deploy-canonical-comment-epoch.yml'
      - 'cloudflare/firestore-documents.js'
      - 'cloudflare/test/firestore-documents.test.js'
      - 'scripts/loadtest/quota_traffic_report.py'
permissions:
  contents: read
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-canonical-epoch]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Run full Worker and repository verification before production changes
        run: |
          npm ci --ignore-scripts
          npm test
          python3 -m unittest discover -s scripts/tests
          python3 cloudflare/test/schema_test.py
          python3 cloudflare/test/migration_test.py
          python3 cloudflare/test/index_plan_test.py
      - name: Compile exact Worker candidate without deploying
        run: npx --yes wrangler@4.157.0 deploy --dry-run --outdir /tmp/worker-candidate
      - name: Fail closed unless 0107 is the sole pending migration
        run: |
          npx --yes wrangler@4.157.0 d1 migrations list friendbook-db --remote > pending-migrations.log 2>&1
          cat pending-migrations.log
          python3 - <<'PY'
          import re,sys
          text=open('pending-migrations.log',encoding='utf-8',errors='replace').read()
          names=sorted(set(re.findall(r'(\d{4}_[A-Za-z0-9_]+\.sql)',text)))
          print('::notice::migration names reported: '+repr(names))
          if names != ['0107_canonical_comment_count_epoch.sql']:
              print('::error::Expected only reviewed additive migration 0107 pending; refusing all production changes.')
              sys.exit(1)
          PY
      - name: Apply only reviewed additive migration 0107 and record it in D1 history
        run: npx --yes wrangler@4.157.0 d1 migrations apply friendbook-db --remote
      - name: Confirm no pending migrations remain
        run: |
          npx --yes wrangler@4.157.0 d1 migrations list friendbook-db --remote > after-migrations.log 2>&1
          cat after-migrations.log
          if grep -q '0107_canonical_comment_count_epoch.sql' after-migrations.log; then
            echo '::error::0107 remains pending after migration apply.'
            exit 1
          fi
      - name: Deploy Worker without changing bindings or vars
        run: npx --yes wrangler@4.157.0 deploy --keep-vars
      - name: Verify public health and unauthenticated auth boundary
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          base='https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev'
          def get(path):
            req=urllib.request.Request(base+path,headers={'User-Agent':'FriendBook-Quota-Fix/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:return r.status,json.load(r)
            except urllib.error.HTTPError as e:return e.code,{}
          status,health=get('/health')
          assert status==200 and health.get('ok') is True and health.get('d1InteractionsEnabled') is True
          assert get('/v1/me')[0]==401
          print('Worker health 200; D1 enabled; unauthenticated API remains 401.')
          PY
