# Targeted code-only fix for the production compound-select limit.
# Never execute the full migration chain or remove existing indexes/data.
# Explicit rollout tag required; source 31ba628 passed Worker and Android CI.
name: Deploy D1-safe comment batches
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths:
      - '.github/workflows/deploy-comment-batches.yml'
      - 'scripts/admin/verify_worker_rollout.py'
permissions:
  contents: read
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-comment-batches]' )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full local regressions before deployment
        run: |
          npm test
          python3 -m unittest discover -s scripts/tests
          python3 cloudflare/test/schema_test.py
          python3 cloudflare/test/migration_test.py
          python3 cloudflare/test/index_plan_test.py
          QUOTA_EXPERIMENT_FRIEND_INDEXES=1 node scripts/loadtest/d1_quota_replay.mjs 30 > /tmp/quota-preview-replay.json
      - name: Refuse unless live configuration matches and rollback version is recorded
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/admin/verify_worker_rollout.py --snapshot /tmp/quota-rollout-before.json
      - name: Compile exact production config without deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.157.0 deploy --dry-run --outdir /tmp/quota-code-bundle
      - name: Require installed epoch and all invalidation triggers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY_CHECK'
          import json,os,urllib.request
          account='92f3d04598822de2e49e14561218d090';db='e1c605ca-a50b-46c6-9deb-56dd1f70d163'
          sql="SELECT (SELECT count(*) FROM friendbook_cf_legacy_comment_epoch WHERE id=1 AND length(generation)=32 AND revision>=0) AS epochs, (SELECT count(*) FROM sqlite_master WHERE type='trigger' AND name IN ('cf_legacy_comment_epoch_insert','cf_legacy_comment_epoch_update','cf_legacy_comment_epoch_delete')) AS triggers"
          req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query',data=json.dumps({'sql':sql}).encode(),headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response: payload=json.load(response)
          assert payload.get('success') and len(payload.get('result',[]))==1
          result=payload['result'][0]
          assert result.get('success') and result.get('results')==[{'epochs':1,'triggers':3}]
          print('Verified installed singleton and three triggers; no schema writes.')
          PY_CHECK
      - name: Deploy Worker code without schema changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.157.0 deploy --keep-vars
      - name: Verify resource preservation and smoke health and auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/admin/verify_worker_rollout.py --snapshot /tmp/quota-rollout-before.json --compare
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base='https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'FriendBook-Code-Rollout/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as e: return e.code,{}
          status,health=get('/health')
          assert status==200 and health.get('ok') is True and health.get('d1InteractionsEnabled') is True
          assert health['views']['ae'] is True
          assert get('/v1/me')[0]==401
          print('Health 200, D1 enabled, Analytics Engine bound, unauthenticated API 401.')
          PY
      - name: Preserve rollback metadata and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quota-code-rollout-evidence
          path: |
            /tmp/quota-rollout-before.json
            /tmp/quota-preview-replay.json
          retention-days: 7
