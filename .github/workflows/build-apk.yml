name: Build FriendBook APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'arena/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "android-35 platform already installed"
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" || \
              echo "::warning::sdkmanager install failed; trying to continue with preinstalled SDK"
          else
            echo "::warning::sdkmanager not found; using preinstalled SDK"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Firebase config present
        run: |
          test -f app/google-services.json && echo "google-services.json found" || (echo "::error::app/google-services.json is missing" && exit 1)

      - name: Build debug APK
        id: dbg
        run: |
          set +e
          gradle assembleDebug --console=plain > build-debug.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Surface compiler errors as annotations
        if: steps.dbg.outputs.exit != '0'
        run: |
          echo "===== gradle tail ====="
          tail -25 build-debug.log
          echo "===== java errors ====="
          grep -E "\.java:[0-9]+: (error|warning)" build-debug.log | head -50 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -E "error: package|error: cannot|error: incompatible|error: method|error: ';'" build-debug.log | head -50 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Fail if debug build failed
        if: steps.dbg.outputs.exit != '0'
        run: exit 1

      - name: Build release APK
        run: gradle assembleRelease --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendBook-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendBook-release-apk
          path: app/build/outputs/apk/release/app-release.apk
