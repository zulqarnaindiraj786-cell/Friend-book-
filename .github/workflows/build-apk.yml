name: Build FriendBook Signed APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, 'arena/**' ]
    # Worker-only changes must not rebuild/re-upload the existing Android release.
    paths-ignore: ['worker.js', 'wrangler.toml', 'package*.json', 'cloudflare/**', 'docs/**', '.github/workflows/cloudflare-worker.yml', '.github/workflows/deploy-cloudflare.yml', '.github/workflows/debug-apk.yml']

concurrency:
  group: friendbook-apk-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Owner paused APK/AAB creation on this quota-fix branch. Source/unit-test
    # work must not build signed packages without a new explicit authorization.
    if: >-
      (github.ref != 'refs/heads/arena/b52bc74d-friend-book' ||
       github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[owner-authorized-android-build]')) &&
      (github.event_name != 'push' ||
       (!contains(github.event.head_commit.message, '[no-release]') &&
        !contains(github.event.head_commit.message, '[android-compile-only]')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for gateway tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard message badge and read-state separation
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Exercise 5000 virtual pagination sessions (model only, no production traffic)
        run: python3 scripts/loadtest/paging_model.py

      - name: Test direct FCM gateway with mocked providers
        run: npm ci --prefix supabase && npm test --prefix supabase

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test actual Firestore SDK queries in isolated demo emulator (no production traffic)
        working-directory: scripts/firebase-tests
        run: |
          set +e
          (npm ci --ignore-scripts && npm test) > emulator-tests.log 2>&1
          RESULT=$?
          if [ "$RESULT" != "0" ]; then
            tail -100 emulator-tests.log | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
          else
            tail -25 emulator-tests.log
          fi
          exit "$RESULT"

      - name: Ensure Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 2>/dev/null || true)"
          if [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "android-36 platform already installed"
          elif [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" || \
              echo "::warning::sdkmanager install failed; trying to continue with preinstalled SDK"
          else
            echo "::warning::sdkmanager not found; using preinstalled SDK"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Firebase config & Production AdMob IDs
        run: |
          test -f app/google-services.json && echo "google-services.json found" || (echo "::error::app/google-services.json is missing" && exit 1)
          grep -q "ca-app-pub-3387480177023669~1513026594" app/src/main/AndroidManifest.xml || (echo "::error::Missing real AdMob APPLICATION_ID in AndroidManifest.xml" && exit 1)
          if grep -Rrq --exclude-dir=build "3940256099942544" app/src app/build.gradle; then
            echo "::error::Test AdMob ID detected in app/ — forbidden in production build!"
            exit 1
          fi

      - name: Reject private credentials in Android sources
        run: |
          if grep -RIlE -- 'BEGIN (RSA )?PRIVATE KEY|os_v2_app_' app/src app/build.gradle; then
            echo "::error::Server credential found in Android sources"
            exit 1
          fi
          if find app/src -type f \( -iname '*service_account*.json' -o -iname '*firebase-adminsdk*.json' \) | grep -q .; then
            echo "::error::Service account file must never be packaged"
            exit 1
          fi

      # Decode the existing release key only on the runner; never print or upload it.
      - name: Build Signed Release APK + Signed Google Play Store AAB (Production Only)
        id: rel
        env:
          JAVA_TOOL_OPTIONS: '-Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2'
          FB_KEYSTORE_B64: ${{ secrets.FB_KEYSTORE_B64 }}
          FRIENDBOOK_RELEASE_STORE_PASSWORD: ${{ secrets.FB_KEYSTORE_PASSWORD || secrets.FRIENDBOOK_RELEASE_STORE_PASSWORD }}
          FRIENDBOOK_RELEASE_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS || secrets.FRIENDBOOK_RELEASE_KEY_ALIAS }}
          FRIENDBOOK_RELEASE_KEY_PASSWORD: ${{ secrets.FB_KEY_PASSWORD || secrets.FRIENDBOOK_RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          set -e
          # The keystore password lives in the repository history (the original
          # release commit). Prefer that known-good pair and verify it with
          # keytool before building; a secret, if present, is only a fallback.
          # Values are masked and never printed.
          BASELINE=6306172bb107bfa3f2b499f418d3cf9e3970d95a
          git fetch --no-tags --depth=1 origin "$BASELINE" >/dev/null 2>&1 || true
          export FRIENDBOOK_RELEASE_STORE_FILE="$RUNNER_TEMP/friendbook-release.p12"
          umask 077
          trap 'rm -f "$FRIENDBOOK_RELEASE_STORE_FILE"' EXIT
          HIST_PW=""; HIST_ALIAS=""; HIST_KEY_PW=""
          if git cat-file -e "$BASELINE:app/friendbook-release.p12" 2>/dev/null; then
            git show "$BASELINE:app/friendbook-release.p12" > "$FRIENDBOOK_RELEASE_STORE_FILE"
            HIST_PW="$(git show "$BASELINE:app/build.gradle" | awk -F"'" '/^[[:space:]]*storePassword /{print $2;exit}')"
            HIST_ALIAS="$(git show "$BASELINE:app/build.gradle" | awk -F"'" '/^[[:space:]]*keyAlias /{print $2;exit}')"
            HIST_KEY_PW="$(git show "$BASELINE:app/build.gradle" | awk -F"'" '/^[[:space:]]*keyPassword /{print $2;exit}')"
            [ -n "$HIST_PW" ] && printf '::add-mask::%s\n' "$HIST_PW"
            [ -n "$HIST_KEY_PW" ] && printf '::add-mask::%s\n' "$HIST_KEY_PW"
            [ -n "$HIST_ALIAS" ] && printf '::add-mask::%s\n' "$HIST_ALIAS"
          fi
          # The owner confirmed the release password is the one from history, so
          # the historical keystore + password pair is authoritative. Each
          # candidate is opened with keytool before use; nothing is printed.
          if [ -n "$HIST_PW" ] && [ -s "$FRIENDBOOK_RELEASE_STORE_FILE" ] \
             && keytool -list -storetype PKCS12 -keystore "$FRIENDBOOK_RELEASE_STORE_FILE" \
                  -storepass "$HIST_PW" >/dev/null 2>&1; then
            echo '::notice:: Using the historical release keystore and password.'
            export FRIENDBOOK_RELEASE_STORE_PASSWORD="$HIST_PW"
            export FRIENDBOOK_RELEASE_KEY_PASSWORD="${HIST_KEY_PW:-$HIST_PW}"
            export FRIENDBOOK_RELEASE_KEY_ALIAS="${HIST_ALIAS:-$FRIENDBOOK_RELEASE_KEY_ALIAS}"
          else
            [ -n "$FRIENDBOOK_RELEASE_STORE_PASSWORD" ] || { echo '::error::No usable signing credential found.'; exit 1; }
            [ -n "$FB_KEYSTORE_B64" ] || { echo '::error::No release keystore available.'; exit 1; }
            printf '%s' "$FB_KEYSTORE_B64" | base64 --decode > "$FRIENDBOOK_RELEASE_STORE_FILE"
            keytool -list -storetype PKCS12 -keystore "$FRIENDBOOK_RELEASE_STORE_FILE" \
              -storepass "$FRIENDBOOK_RELEASE_STORE_PASSWORD" >/dev/null 2>&1 \
              || { echo '::error::The release secret does not open its keystore.'; exit 1; }
            echo '::notice:: Using the release keystore from the repository secret.'
          fi
          unset FB_KEYSTORE_B64 HIST_PW HIST_KEY_PW
          : "${FRIENDBOOK_RELEASE_KEY_ALIAS:?Missing release key alias}"
          : "${FRIENDBOOK_RELEASE_KEY_PASSWORD:?Missing release key password}"
          set -e
          for VER in "15-robolectric-12650502-i7" "9-robolectric-4913185-2-i7"; do
            DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$VER"
            JAR="$DIR/android-all-instrumented-$VER.jar"
            URL="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/$VER/android-all-instrumented-$VER.jar"
            mkdir -p "$DIR"
            curl -fsSL --connect-timeout 15 --max-time 120 --retry 3 --retry-max-time 180 --retry-delay 3 --retry-all-errors "$URL.sha512" -o "$JAR.sha512.tmp"
            HASH="$(awk '{print $1}' "$JAR.sha512.tmp")"
            [[ "$HASH" =~ ^[a-fA-F0-9]{128}$ ]]
            if [ ! -f "$JAR" ] || ! printf '%s  %s\n' "$HASH" "$JAR" | sha512sum --check --status; then
              curl -fsSL --connect-timeout 15 --max-time 120 --retry 3 --retry-max-time 180 --retry-delay 3 --retry-all-errors "$URL" -o "$JAR.tmp"
              printf '%s  %s\n' "$HASH" "$JAR.tmp" | sha512sum --check --status
              mv "$JAR.tmp" "$JAR"
            fi
            rm "$JAR.sha512.tmp"
          done
          set +e
          gradle testReleaseUnitTest bundleRelease assembleRelease --console=plain > build-release.log 2>&1
          RC=$?
          if [ "$RC" != "0" ]; then
            echo "Retrying Gradle build after transient artifact fetch..."
            sleep 5
            gradle testReleaseUnitTest bundleRelease assembleRelease --rerun-tasks --console=plain > build-release.log 2>&1
            RC=$?
          fi
          echo "exit=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Surface bounded unit-test failure details
        if: steps.rel.outputs.exit != '0'
        run: python3 scripts/ci/report_android_failure.py

      - name: Surface compiler errors as annotations
        if: steps.rel.outputs.exit != '0'
        run: |
          echo "===== javac error blocks (with symbol details) ====="
          grep -A8 -E "\.java:[0-9]+: error:" build-release.log | head -120 | while IFS= read -r line; do
            echo "::error::${line:0:250}"
          done
          echo "===== failing source lines ====="
          grep -oE "^/[^ ]+\.java:[0-9]+: error:" build-release.log | sort -u | while IFS= read -r hit; do
            f="${hit%%:*}"; ln="$(echo "$hit" | cut -d: -f2)"
            content=$(sed -n "${ln}p" "$f")
            echo "::error file=$f,line=$ln,title=source::${content:0:250}"
          done
          echo "===== aapt/resource errors ====="
          grep -Ei "aapt|resource|merge|duplicate" build-release.log | grep -Ei "error|failed" | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "===== gradle tail (as warnings so we can read them) ====="
          grep -vE "^$" build-release.log | tail -60 | while IFS= read -r line; do
            echo "::warning::${line:0:300}"
          done

      - name: Fail if release build failed
        if: steps.rel.outputs.exit != '0'
        run: exit 1

      - name: Verify APK and AAB signatures
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          LC_ALL=C jarsigner -verify app/build/outputs/bundle/release/app-release.aab > aab-signature-check.log 2>&1
          grep -q 'jar verified.' aab-signature-check.log || { echo '::error::AAB signature verification failed'; exit 1; }
          echo '::notice::APK and AAB signatures verified.'

      - name: Require actual Android core test results, not source-only checks
        run: python3 scripts/ci/verify_android_tests.py

      - name: Mark branch artifacts as migration candidates, not a production capacity pass
        if: github.ref != 'refs/heads/main'
        run: |
          echo '## Migration candidate only' >> "$GITHUB_STEP_SUMMARY"
          echo 'Branch APK/AAB are test candidates, not a production capacity pass. No merge or Google Play publishing occurs. Build tests do not certify full-app capacity.' >> "$GITHUB_STEP_SUMMARY"

      - name: Package Signed Release APK, Play Store AAB (API 36 + R8 Mapping)
        run: |
          ls -lh app/build/outputs/bundle/release/
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/bundle/release/app-release.aab friendbook-playstore.aab
          cp app/build/outputs/apk/release/app-release.apk friendbook.apk
          cp app/build/outputs/mapping/release/mapping.txt friendbook-mapping.txt
          unzip -tq friendbook-playstore.aab
          unzip -tq friendbook.apk
          unzip -Z1 friendbook-playstore.aab | grep -Fx 'base/manifest/AndroidManifest.xml'
          unzip -Z1 friendbook-playstore.aab | grep -Fx 'BundleConfig.pb'
          unzip -l friendbook-playstore.aab | grep "proguard.map"
          test -s friendbook-mapping.txt && echo "Verified non-empty R8 deobfuscation mapping.txt"
          AAB_BYTES=$(stat -c '%s' friendbook-playstore.aab)
          test "$AAB_BYTES" -ge 1000000 || { echo "::error::AAB unexpectedly small: ${AAB_BYTES} bytes"; exit 1; }
          ls -lh friendbook-playstore.aab friendbook.apk friendbook-mapping.txt
          sha256sum friendbook.apk friendbook-playstore.aab friendbook-mapping.txt > friendbook-SHA256SUMS.txt
          sha256sum --check friendbook-SHA256SUMS.txt

      - name: Upload Google Play Store Signed AAB
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: FriendBook-playstore-aab
          path: friendbook-playstore.aab
          retention-days: 7

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: FriendBook-release-apk
          path: friendbook.apk
          retention-days: 7

      - name: Upload R8 Deobfuscation Mapping
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: FriendBook-release-mapping
          path: friendbook-mapping.txt
          retention-days: 7

      - name: Publish owner-requested signed test candidate (not Latest)
        if: github.ref == 'refs/heads/arena/b52bc74d-friend-book' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[signed-candidate]'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(grep "versionName" app/build.gradle | head -n1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          VCODE=$(grep "versionCode" app/build.gradle | head -n1 | awk '{print $2}')
          TAG="friendbook-${VER}-signed-${GITHUB_SHA:0:8}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo '::error::Candidate already exists; refusing to overwrite assets.'
            exit 1
          fi
          gh release create "$TAG" friendbook.apk friendbook-playstore.aab friendbook-mapping.txt friendbook-SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "FriendBook ${VER} (${VCODE}) — consolidated signed quota candidate" \
            --notes "Signed candidate from source ${GITHUB_SHA}, versionCode ${VCODE}. Includes the cumulative changes in this branch. APK/AAB ZIP integrity and signatures verified; remote AAB size and SHA256 verified after upload. Not merged, not uploaded to Google Play, not auto-installed, and not a full-day quota guarantee. Production Latest unchanged. SHA256 checksums and R8 mapping attached."
          EXPECTED_BYTES=$(stat -c '%s' friendbook-playstore.aab)
          EXPECTED_SHA=$(sha256sum friendbook-playstore.aab | awk '{print $1}')
          for attempt in 1 2 3 4 5; do
            ASSET_SIZE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[] | select(.name=="friendbook-playstore.aab") | .size' 2>/dev/null || true)
            ASSET_DIGEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[] | select(.name=="friendbook-playstore.aab") | .digest' 2>/dev/null || true)
            REMOTE_BYTES=${ASSET_SIZE:-missing}
            REMOTE_SHA=${ASSET_DIGEST#sha256:}
            if [ "$REMOTE_BYTES" = "$EXPECTED_BYTES" ] && [ "$REMOTE_SHA" = "$EXPECTED_SHA" ]; then
              echo "::notice::Published AAB verified: ${REMOTE_BYTES} bytes; SHA256 matches local build."
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Published AAB size/digest mismatch (local ${EXPECTED_BYTES} bytes, remote ${REMOTE_BYTES:-missing} bytes). Do not use this release asset."
              exit 1
            fi
            sleep 3
          done

      # Publish the owner-requested release APK + Play Store AAB so in-app updates serve the new Cloudflare APK.
      - name: Publish Signed Release APK + Play Store AAB to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/15a53658-friend-book' || github.head_ref == 'arena/15a53658-friend-book' || github.ref == 'refs/heads/arena/9e217492-friend-book' || github.head_ref == 'arena/9e217492-friend-book' || github.ref == 'refs/heads/arena/7c7ddb7b-friend-book'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          publish() {
            local OUTPUT CODE
            if OUTPUT=$(gh "$@" 2>&1); then
              printf '%s\n' "$OUTPUT"
            else
              CODE=$?
              while IFS= read -r line; do echo "::error::${line:0:500}"; done <<< "$OUTPUT"
              return "$CODE"
            fi
          }
          VER=$(grep "versionName" app/build.gradle | head -n1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          VCODE=$(grep "versionCode" app/build.gradle | head -n1 | awk '{print $2}')
          TAG="v${VER}"
          TITLE="friendbook ${TAG} (Signed Production Release APK + Play Store AAB)"
          NOTES="Production Release build (\`versionCode ${VCODE}\`, \`com.friendbook.social\` ${TAG}) — Signed Release APK (\`friendbook.apk\`) + Signed Google Play Store AAB (\`friendbook-playstore.aab\`) with Pure Real Production AdMob Native Ads (\`ca-app-pub-3387480177023669~1513026594\`, Feed Native \`4957447582\`, Reels Native \`6468085788\`), Direct Google Sign-In, Live Studio, Reels & Groups."
          if gh release view "$TAG" >/dev/null 2>&1; then
            publish release upload "$TAG" friendbook-playstore.aab friendbook.apk friendbook-mapping.txt --clobber
            publish release edit "$TAG" --latest --target "$TARGET_SHA" --title "$TITLE" --notes "$NOTES"
          else
            publish release create "$TAG" friendbook-playstore.aab friendbook.apk friendbook-mapping.txt --target "$TARGET_SHA" \
              --latest \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
