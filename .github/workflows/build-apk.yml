name: Build FriendBook APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'arena/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "android-35 platform already installed"
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" || \
              echo "::warning::sdkmanager install failed; trying to continue with preinstalled SDK"
          else
            echo "::warning::sdkmanager not found; using preinstalled SDK"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Firebase config present
        run: |
          test -f app/google-services.json && echo "google-services.json found" || (echo "::error::app/google-services.json is missing" && exit 1)

      - name: Build debug APK
        id: dbg
        run: |
          set +e
          gradle assembleDebug --console=plain > build-debug.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Surface compiler errors as annotations
        if: steps.dbg.outputs.exit != '0'
        run: |
          echo "===== javac error blocks (with symbol details) ====="
          grep -A8 -E "\.java:[0-9]+: error:" build-debug.log | head -120 | while IFS= read -r line; do
            echo "::error::${line:0:250}"
          done
          echo "===== failing source lines ====="
          grep -oE "^/[^ ]+\.java:[0-9]+: error:" build-debug.log | sort -u | while IFS= read -r hit; do
            f="${hit%%:*}"; ln="$(echo "$hit" | cut -d: -f2)"
            content=$(sed -n "${ln}p" "$f")
            echo "::error file=$f,line=$ln,title=source::${content:0:250}"
          done
          echo "===== aapt/resource errors ====="
          grep -Ei "aapt|resource|merge|duplicate" build-debug.log | grep -Ei "error|failed" | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "===== gradle tail (as warnings so we can read them) ====="
          grep -vE "^$" build-debug.log | tail -60 | while IFS= read -r line; do
            echo "::warning::${line:0:300}"
          done

      - name: Fail if debug build failed
        if: steps.dbg.outputs.exit != '0'
        run: exit 1

      - name: Build release APK
        run: gradle assembleRelease --console=plain --stacktrace

      - name: List build outputs (so a missing APK is visible, not guessed)
        if: always()
        run: |
          echo "===== apk outputs ====="
          find app/build/outputs -name '*.apk' -o -name '*.aab' | head -20 || true

      # No upload-artifact steps on purpose: the account's Actions artifact storage is exhausted
      # (488 old build artifacts, ~3 GB) and GitHub refuses every new upload until it drains.
      # The binaries themselves are never lost - signed releases go to GitHub Releases, and the
      # cleanup-artifacts workflow frees the storage. A failed convenience upload must never be
      # able to hide the compile verdict again.
