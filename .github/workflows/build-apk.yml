name: Build APK & Release

on:
  push:
    branches: [ main, arena/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject private credentials in Android sources
        run: |
          if grep -rn "CLOUDFLARE_API_TOKEN\|CLOUDINARY_API_SECRET\|R2_SECRET_ACCESS_KEY" app/src/main/; then
            echo "::error::Private server secret found in Android client source!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 2>/dev/null || true)"
          if [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "android-36 platform already installed"
          elif [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" || echo "::warning::sdkmanager install failed; trying to continue with preinstalled SDK"
          else
            echo "::warning::sdkmanager not found; using preinstalled SDK"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type all
          chmod +x gradlew
          ./gradlew --version

      - name: Build Signed Release APK, Play Store AAB & PresenceSocketControllerCheck
        run: |
          ./gradlew testReleaseUnitTest bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle.log
          python3 scripts/ci/verify_presence_android_tests.py

      - name: Verify Signed Release APK & AAB Signatures
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*-release.apk" -o -name "app-release.apk" | head -1)
          RELEASE_AAB=$(find app/build/outputs/bundle/release -name "*-release.aab" -o -name "app-release.aab" | head -1)
          MAPPING_TXT=$(find app/build/outputs/mapping/release -name "mapping.txt" | head -1)
          test -n "$RELEASE_APK" && test -f "$RELEASE_APK"
          test -n "$RELEASE_AAB" && test -f "$RELEASE_AAB"
          cp "$RELEASE_APK" friendbook.apk
          cp "$RELEASE_AAB" friendbook-playstore.aab
          if [ -n "$MAPPING_TXT" ] && [ -f "$MAPPING_TXT" ]; then
            cp "$MAPPING_TXT" friendbook-mapping.txt
          else
            touch friendbook-mapping.txt
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose friendbook.apk
          fi
          jarsigner -verify friendbook-playstore.aab | tail -5
          ls -lh friendbook.apk friendbook-playstore.aab friendbook-mapping.txt

      - name: Upload Signed APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: friendbook-signed-release
          path: |
            friendbook.apk
            friendbook-playstore.aab
          if-no-files-found: error

      - name: Upload R8 Mapping Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FriendBook-release-mapping
          path: friendbook-mapping.txt

      - name: Get Version Info
        id: version
        run: |
          VERSION_NAME=$(grep -oP "versionName\s+['\"]\K[^'\"]+" app/build.gradle | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle | head -1)
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "version_name=${VERSION_NAME:-2.9.0}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE:-123}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION_NAME:-2.9.0}-${VERSION_CODE:-123}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Publish Signed Release APK + Play Store AAB
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: friendbook ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.timestamp }})
          draft: false
          prerelease: false
          make_latest: true
          files: |
            friendbook.apk
            friendbook-playstore.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
