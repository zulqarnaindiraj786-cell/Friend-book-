name: Build FriendBook APK & Publish Website

on:
  workflow_dispatch:
  push:
    branches: [ main, 'arena/**' ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "android-35 platform already installed"
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" || \
              echo "::warning::sdkmanager install failed; trying to continue with preinstalled SDK"
          else
            echo "::warning::sdkmanager not found; using preinstalled SDK"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Firebase config present
        run: |
          test -f app/google-services.json && echo "google-services.json found" || (echo "::error::app/google-services.json is missing" && exit 1)

      - name: Build debug APK
        id: dbg
        run: |
          set +e
          gradle assembleDebug --console=plain > build-debug.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Surface compiler errors as annotations
        if: steps.dbg.outputs.exit != '0'
        run: |
          echo "===== javac error blocks (with symbol details) ====="
          grep -A8 -E "\.java:[0-9]+: error:" build-debug.log | head -120 | while IFS= read -r line; do
            echo "::error::${line:0:250}"
          done
          echo "===== failing source lines ====="
          grep -oE "^/[^ ]+\.java:[0-9]+: error:" build-debug.log | sort -u | while IFS= read -r hit; do
            f="${hit%%:*}"; ln="$(echo "$hit" | cut -d: -f2)"
            content=$(sed -n "${ln}p" "$f")
            echo "::error file=$f,line=$ln,title=source::${content:0:250}"
          done
          echo "===== aapt/resource errors ====="
          grep -Ei "aapt|resource|merge|duplicate" build-debug.log | grep -Ei "error|failed" | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "===== gradle tail (as warnings so we can read them) ====="
          grep -vE "^$" build-debug.log | tail -60 | while IFS= read -r line; do
            echo "::warning::${line:0:300}"
          done

      - name: Fail if debug build failed
        if: steps.dbg.outputs.exit != '0'
        run: exit 1

      - name: Build Signed Google Play Store AAB + Signed Release APK
        run: |
          gradle bundleRelease assembleRelease --console=plain --stacktrace
          ls -lh app/build/outputs/bundle/release/
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/bundle/release/app-release.aab friendbook-playstore.aab
          cp app/build/outputs/apk/release/app-release.apk friendbook.apk
          cp app/build/outputs/apk/debug/app-debug.apk friendbook-debug.apk
          cp friendbook.apk docs/friendbook.apk
          (cd docs && zip -r ../friendbook-website.zip .)
          ls -lh friendbook-playstore.aab friendbook.apk friendbook-website.zip

      - name: Upload Google Play Store Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: FriendBook-playstore-aab
          path: friendbook-playstore.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendBook-debug-apk
          path: friendbook-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendBook-release-apk
          path: friendbook.apk

      - name: Upload Standalone Website + APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FriendBook-Website-Bundle-ZIP
          path: friendbook-website.zip

      - name: Publish Signed Google Play AAB + APK & Website Bundle to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.2.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" friendbook-playstore.aab friendbook.apk friendbook-debug.apk friendbook-website.zip --clobber
            gh release edit "$TAG" --latest --title "friendbook v2.2.0 (Google Play Signed AAB + Signed APK)"
          else
            gh release create "$TAG" friendbook-playstore.aab friendbook.apk friendbook-debug.apk friendbook-website.zip \
              --latest \
              --title "friendbook v2.2.0 (Google Play Signed AAB + Signed APK)" \
              --notes "Google Play Store ready signed Android App Bundle (\`friendbook-playstore.aab\`, \`versionCode 21\`, \`com.friendbook\` v2.2.0) + Official Signed APK (\`friendbook.apk\`) with Direct Google Login, Password Reset Link, Default Only-Me Email Privacy, Crisp White Headers & Vector Back Arrows."
          fi

      - name: Upload Website Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy-website:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy Website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
