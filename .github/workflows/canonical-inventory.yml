# Read-only, bounded aggregate diagnostics; no document identities in logs.
name: Canonical coverage inventory
on:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths: [.github/workflows/canonical-inventory.yml, scripts/loadtest/canonical_inventory.py, scripts/tests/test_canonical_inventory.py]
permissions:
  contents: read
jobs:
  inventory:
    if: contains(github.event.head_commit.message, '[canonical-inventory]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test capped inventory
        run: python3 -m unittest scripts.tests.test_canonical_inventory
      - name: Inspect bounded aggregates with quota reserve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --notification-inspection-budget
          python3 -m scripts.loadtest.canonical_inventory --users
          python3 scripts/loadtest/d1_account_usage_analytics.py --notification-inspection-budget
