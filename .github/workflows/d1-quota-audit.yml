name: Read-only D1 quota audit
on:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths: [.github/workflows/d1-quota-audit.yml]
permissions: {}
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read recent top query patterns without exposing SQL values
        run: |
          python - <<'PY'
          import datetime as dt, os, urllib.request, urllib.error, json, re
          now=dt.datetime.now(dt.timezone.utc)
          fmt=lambda t:t.strftime('%Y-%m-%dT%H:%M:%SZ')
          def query(metric):
              q='''{ viewer { accounts(filter:{accountTag:"92f3d04598822de2e49e14561218d090"}) {
                  d1QueriesAdaptiveGroups(limit:10, orderBy:[sum_%s_DESC], filter:{databaseId:"e1c605ca-a50b-46c6-9deb-56dd1f70d163",datetime_geq:"%s",datetime_leq:"%s"}) {
                      dimensions { query } sum { rowsRead rowsWritten } count
                  } } } }'''%(metric,fmt(now-dt.timedelta(hours=1)),fmt(now))
              req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',data=json.dumps({'query':q}).encode(),headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r: result=json.load(r)
              except urllib.error.HTTPError as e:
                  raise SystemExit(f'Analytics API HTTP {e.code}; no production changes made.')
              if result.get('errors'):
                  msg=result['errors'][0].get('message','Unknown GraphQL error')
                  raise SystemExit('Analytics query rejected: '+re.sub(r'[^a-zA-Z0-9 _.:,-]','',msg)[:200])
              print('Top by '+metric)
              for account in result['data']['viewer']['accounts']:
                  for row in account['d1QueriesAdaptiveGroups']:
                      sql=row['dimensions']['query'] or ''
                      op=re.match(r'\s*(SELECT|INSERT|UPDATE|DELETE|WITH|REPLACE)\b',sql,re.I)
                      tables=sorted(set(re.findall(r'\b(?:FROM|JOIN|INTO|UPDATE)\s+(friendbook_[a-z0-9_]+)',sql,re.I)))
                      print('::notice::',metric,op.group(1).upper() if op else 'OTHER', ','.join(tables), row['sum'], 'executions',row['count'])
          for metric in ('rowsRead','rowsWritten'): query(metric)
          PY
