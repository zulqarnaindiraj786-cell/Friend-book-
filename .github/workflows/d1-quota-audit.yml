# Analytics only: never issues D1 SQL or generates application traffic; classify the historical-comment page shape.
name: Read-only D1 quota audit
on:
  workflow_dispatch:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths: [.github/workflows/d1-quota-audit.yml]
permissions: {}
jobs:
  analytics:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[audit-d1-readonly]')
    strategy:
      fail-fast: false
      matrix:
        window: [latest-5m, latest-15m, latest-60m]
        metric: [rowsRead, rowsWritten]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AUDIT_WINDOW: ${{ matrix.window }}
      AUDIT_METRIC: ${{ matrix.metric }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read remaining high-cost query patterns without exposing SQL values
        run: |
          python - <<'PY'
          import datetime as dt, os, urllib.request, urllib.error, json, re
          now=dt.datetime.now(dt.timezone.utc)
          fmt=lambda t:t.strftime('%Y-%m-%dT%H:%M:%SZ')
          def query(metric,start,end,label):
              q='''{ viewer { accounts(filter:{accountTag:"92f3d04598822de2e49e14561218d090"}) {
                  d1QueriesAdaptiveGroups(limit:60, orderBy:[sum_%s_DESC], filter:{databaseId:"e1c605ca-a50b-46c6-9deb-56dd1f70d163",datetime_geq:"%s",datetime_leq:"%s"}) {
                      dimensions { query } sum { rowsRead rowsWritten } count
                  } } } }'''%(metric,fmt(start),fmt(end))
              req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',data=json.dumps({'query':q}).encode(),headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r: result=json.load(r)
              except urllib.error.HTTPError as e:
                  raise SystemExit(f'Analytics API HTTP {e.code}; no production changes made.')
              if result.get('errors'):
                  msg=result['errors'][0].get('message','Unknown GraphQL error')
                  raise SystemExit('Analytics query rejected: '+re.sub(r'[^a-zA-Z0-9 _.:,-]','',msg)[:200])
              print('Top by '+metric)
              for account in result['data']['viewer']['accounts']:
                  printed=0
                  focus=[]
                  for row in account['d1QueriesAdaptiveGroups']:
                      sql=row['dimensions']['query'] or ''
                      op=re.match(r'\s*(SELECT|INSERT|UPDATE|DELETE|WITH|REPLACE)\b',sql,re.I)
                      # Extract only known fixed-schema identifiers; never print raw SQL or values.
                      tables=sorted(set(re.findall(r'\b(?:FROM|JOIN|INTO|UPDATE)\s+(friendbook_[a-z0-9_]+)',sql,re.I)))
                      flags=[k for k in ('parent_path','collection','doc_id','json_extract','createdAt','chatId','LIMIT','ORDER BY','UNION ALL','owner_uid','participants','update_time','last_seen','session_id') if k.lower() in sql.lower()]
                      if not tables:
                          refs=sorted(set(re.findall(r'\bfriendbook_cf_[a-z0-9_]+\b',sql,re.I)))
                          flags.extend('ref='+ref for ref in refs)
                          flags.extend('uses='+name for name in ('json_each','sqlite_master','COUNT','EXISTS','VALUES','INSERT','UPDATE','DELETE') if re.search(r'\b'+name+r'\b',sql,re.I))
                          import hashlib
                          flags.append('sqlhash='+hashlib.sha256(sql.encode()).hexdigest()[:12])
                      for field in ('parent_path','collection_id','collection','path','owner_uid','doc_id'):
                          if re.search(r'\b'+field+r'\s*=\s*\?',sql,re.I): flags.append(field+'=bound')
                      for root in ('notifications','friends','officialBroadcasts','posts','reels','stories','users','chats','friend_requests'):
                          if re.search(r"\b(?:parent_path|collection_id|collection)\s*=\s*'"+root+"'",sql,re.I): flags.append('root='+root)
                      if re.search(r'\bquota_scan_class\b',sql,re.I): flags.append('tagged-fallback')
                      scan=re.search(r'\b([0-8])\s+AS\s+quota_scan_class\b',sql,re.I)
                      alias=re.search(r'\bquota_root_([a-z_]+)\b',sql,re.I)
                      if alias: flags.append('scan='+alias.group(1))
                      if re.search(r'\bidx_cf_(?:legacy_)?people_default_page\b',sql,re.I): flags.append('bounded-users')
                      if re.search(r'\bquota_people_head\b',sql,re.I): flags.append('bounded-users-head')
                      if re.search(r"\bGLOB\s+'chats/\*/messages'",sql,re.I): flags.append('chat-message-page')
                      if re.search(r"\bGLOB\s+'lives/\*/chat'",sql,re.I): flags.append('live-chat-page')
                      if re.search(r'\bidx_cf_(?:legacy_)?payments_user\b',sql,re.I): flags.append('bounded-payment-owner')
                      if re.search(r'\bAS\s+slot\s*,\s*COUNT\s*\(\s*\*\s*\)',sql,re.I) and re.search(r'\bUNION\s+ALL\b',sql,re.I): flags.append('bounded-feed-counts')
                      if re.search(r'\bORDER\s+BY\s+a\.updated_at\s+DESC\s*,\s*a\.path\s+DESC\b',sql,re.I) and re.search(r'\bfriendbook_cf_comments\b',sql,re.I): flags.append('legacy-comment-scan')
                      if re.search(r'\bidx_cf_comment_page_(?:post|post_legacy|resource)\b',sql,re.I): flags.append('bounded-legacy-comment-page-indexed')
                      if re.search(r'\bCOUNT\s*\(\s*f\.path\s*\)',sql,re.I): flags.append('one-off-overlap-audit')
                      if re.search(r'\bidx_cf_(?:legacy_)?posts_feed_page\b',sql,re.I): flags.append('bounded-feed')
                      if re.search(r'\bidx_cf_(?:legacy_)?lives_status\b',sql,re.I): flags.append('bounded-live-discovery')
                      if re.search(r'\bidx_cf_presence_visible(?:_online)?_seen\b',sql,re.I): flags.append('bounded-presence')
                      if re.search(r'\bON\s+CONFLICT\b',sql,re.I): flags.append('upsert')
                      if re.search(r'\bINSERT\s+INTO\s+friendbook_cf_documents\s*\(',sql,re.I) and re.search(r'\bON\s+CONFLICT\s*\(\s*path\s*\)',sql,re.I): flags.append('shared-mirror-upsert')
                      if re.search(r'\bRETURNING\b',sql,re.I): flags.append('returning')
                      if re.search(r'\bfriendbook_cf_social_guards\b',sql,re.I): flags.append('guard')
                      if re.search(r'\bfriendbook_cf_chat_participants\b',sql,re.I): flags.append('chat-members')
                      if re.search(r'\bfriendbook_cf_firestore_documents\b',sql,re.I) and re.search(r'\bfriendbook_cf_documents\b',sql,re.I): flags.append('both-stores')
                      if scan: flags.append('scan='+['other','users','posts','reels','stories','pages','groups','chats','friend_requests'][int(scan.group(1))])
                      parts=(label,metric,op.group(1).upper() if op else 'OTHER', ','.join(tables), row['sum'], 'executions',row['count'],'shape',','.join(flags))
                      if printed<8:
                          print('::notice::',*parts)
                          printed+=1
                      elif any(f.startswith(('bounded-','scan=','shared-mirror-')) for f in flags):
                          focus.append(' '.join(map(str,parts)))
                  if focus: print('::notice:: Focus patterns %0A'+'%0A'.join(focus))
          if os.environ['AUDIT_METRIC']=='rowsRead' and os.environ['AUDIT_WINDOW']=='latest-15m':
              midnight=now.replace(hour=0,minute=0,second=0,microsecond=0)
              q='''{ viewer { accounts(filter:{accountTag:"92f3d04598822de2e49e14561218d090"}) {
                  d1QueriesAdaptiveGroups(limit:1,filter:{databaseId:"e1c605ca-a50b-46c6-9deb-56dd1f70d163",datetime_geq:"%s",datetime_leq:"%s"}) {
                    sum { rowsRead rowsWritten } count
                  } } } }'''%(fmt(midnight),fmt(now))
              req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',data=json.dumps({'query':q}).encode(),headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r: totals=json.load(r)
                  if totals.get('errors'): print('::notice:: UTC daily analytics aggregate unavailable')
                  else:
                      for account in totals['data']['viewer']['accounts']:
                          print('::notice:: UTC daily adaptive query analytics',account['d1QueriesAdaptiveGroups'],fmt(now))
              except (urllib.error.URLError, KeyError, ValueError): print('::notice:: UTC daily analytics aggregate unavailable')
          window=os.environ["AUDIT_WINDOW"]
          query(os.environ["AUDIT_METRIC"],now-dt.timedelta(minutes=int(window.removeprefix("latest-").removesuffix("m"))),now,window)
          PY
