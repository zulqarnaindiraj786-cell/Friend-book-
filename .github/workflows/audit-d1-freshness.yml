name: Audit D1 Freshness

# Answers one question and nothing else: is D1 the live data, or a stale copy?
#
# The counts we had were compatible with both answers. 4,651 rows in D1 against ~4,377 in
# Firestore says D1 is not short of documents, but it says nothing about whether anything has
# been written to it since a copy finished. The timestamps say that, and reading them costs
# zero Firestore reads — so this stays safe to run while the Firestore read path is blocked.
#
# It talks to the Cloudflare D1 REST API directly rather than to the worker. The worker's
# migration routes are gated behind MIGRATION_ADMIN_TOKEN, which is not stored as a repository
# secret, and going through the API means this diagnostic keeps working regardless of what the
# worker is doing.
#
# Read-only by construction: every statement below is a SELECT.

on:
  push:
    paths:
      - '.github/workflows/audit-d1-freshness.yml'
      - 'scripts/audit_d1_freshness.py'
      - 'scripts/d1_coverage.py'
      - 'scripts/verify_posts_mapping.py'
      - 'scripts/inspect_documents.py'
      - 'scripts/repair_documents.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: What D1 Holds Right Now
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # One read against Firestore: has the 429 gate opened? Twelve attempts were refused
      # with a bare RESOURCE_EXHAUSTED and no quota detail, and retrying inside it kept it
      # shut, so this asks once and does not retry.
      - name: Check whether the Firestore gate has opened
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet firebase-admin || true
          python3 - <<'PYEOF'
          import json, os, sys
          try:
              import firebase_admin
              from firebase_admin import credentials, firestore
          except ImportError as e:
              print(f"::warning::firebase_admin unavailable: {e}")
              sys.exit(0)
          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT", "")
          if not raw:
              print("::warning::FIREBASE_ADMIN_SERVICE_ACCOUNT is not set")
              sys.exit(0)
          try:
              info = json.loads(raw)
              firebase_admin.initialize_app(credentials.Certificate(info))
          except json.JSONDecodeError:
              firebase_admin.initialize_app(credentials.Certificate(raw))
          client = firestore.client()
          for coll in ("posts", "users", "notifications"):
              try:
                  n = client.collection(coll).limit(1).get()
                  print(f"::notice::FIRESTORE OPEN: {coll} readable ({len(n)} doc sampled)")
              except Exception as e:
                  print(f"::error::FIRESTORE CLOSED: {coll} -> {type(e).__name__}: {str(e)[:120]}")
          PYEOF

      # Counts only. The writes themselves are a separate, deliberate step.
      - name: Repair dry run (counts only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: >-
            ${{ secrets.CF_ACCOUNT_ID != '' &&
                secrets.CF_ACCOUNT_ID ||
                '92f3d04598822de2e49e14561218d090' }}
          D1_DATABASE_ID: e1c605ca-a50b-46c6-9deb-56dd1f70d163
        run: python3 scripts/repair_documents.py

      - name: Dump what the document store actually contains
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: >-
            ${{ secrets.CF_ACCOUNT_ID != '' &&
                secrets.CF_ACCOUNT_ID ||
                '92f3d04598822de2e49e14561218d090' }}
          D1_DATABASE_ID: e1c605ca-a50b-46c6-9deb-56dd1f70d163
        # The check-run only keeps ten annotations, so the full dump goes to a file that is
        # readable from the job output rather than being cut off mid-collection.
        run: |
          python3 scripts/inspect_documents.py 2>&1 | tee inspect-documents.log
          echo '--- full dump ---'
          cat inspect-documents.log

