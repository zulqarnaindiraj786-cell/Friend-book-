name: Audit D1 Freshness

# Answers one question and nothing else: is D1 the live data, or a stale copy?
#
# The counts we had were compatible with both answers. 4,651 rows in D1 against ~4,377 in
# Firestore says D1 is not short of documents, but it says nothing about whether anything has
# been written to it since a copy finished. The timestamps say that, and reading them costs
# zero Firestore reads — so this stays safe to run while the Firestore read path is blocked.
#
# It talks to the Cloudflare D1 REST API directly rather than to the worker. The worker's
# migration routes are gated behind MIGRATION_ADMIN_TOKEN, which is not stored as a repository
# secret, and going through the API means this diagnostic keeps working regardless of what the
# worker is doing.
#
# Read-only by construction: every statement below is a SELECT.

on:
  push:
    paths:
      - '.github/workflows/audit-d1-freshness.yml'
      - 'scripts/audit_d1_freshness.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: What D1 Holds Right Now
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Query D1 for row counts and write timestamps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: >-
            ${{ secrets.CF_ACCOUNT_ID != '' &&
                secrets.CF_ACCOUNT_ID ||
                '92f3d04598822de2e49e14561218d090' }}
          D1_DATABASE_ID: e1c605ca-a50b-46c6-9deb-56dd1f70d163
        run: python3 scripts/audit_d1_freshness.py
