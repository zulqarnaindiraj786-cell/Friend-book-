name: Quota report privacy tests
on:
  push:
    branches: ['quota/**']
    paths:
      - '.github/workflows/quota-report-tests.yml'
      - 'scripts/loadtest/quota_traffic_report.py'
      - 'scripts/tests/test_quota_traffic_report.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/quota-report-tests.yml'
      - 'scripts/loadtest/quota_traffic_report.py'
      - 'scripts/tests/test_quota_traffic_report.py'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run quota report privacy and attribution tests
        run: python3 -m unittest scripts.tests.test_quota_traffic_report -v
