# Two capped aggregates only; no record values or writes.
name: Pages and events aggregate preflight
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths: [.github/workflows/simple-root-preflight.yml, scripts/loadtest/simple_root_preflight.py, scripts/tests/test_simple_root_preflight.py]
permissions:
  contents: read
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[simple-root-preflight]') && contains(github.event.head_commit.message, '[allow-production-scans]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts.tests.test_simple_root_preflight -v
      - name: Capped aggregates only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/simple_root_preflight.py
