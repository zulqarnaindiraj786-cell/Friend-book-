name: Budgeted Firestore archive to D1
on:
  push:
    branches: ['arena/f6bf61bd-friend-book']
    paths:
      - '.github/workflows/quota-firestore-copy.yml'
      - 'scripts/admin/quota_firestore_copy.py'
      - 'scripts/tests/test_quota_firestore_copy.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: friendbook-quota-firestore-copy
  cancel-in-progress: false
jobs:
  copy:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[quota-copy]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test quota reservations locally, without provider reads
        run: python3 -m unittest discover -s scripts/tests -p 'test_quota_firestore_copy.py' -v
      - name: Verify required credentials exist without displaying them
        env:
          FIREBASE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$FIREBASE_ADMIN_SERVICE_ACCOUNT" ]; then echo '::error::Firebase service account secret unavailable; no Firebase read attempted'; exit 1; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo '::error::Cloudflare token unavailable; no Firebase read attempted'; exit 1; fi
      - name: Install dependencies
        run: python3 -m pip install 'google-auth==2.40.3' 'requests==2.32.5'
      - name: Copy to private D1 archive, with durable daily limit
        env:
          FIREBASE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/admin/quota_firestore_copy.py --execute --daily-budget 15000 --extend-exhausted-today
