# Targeted evidence-backed removal of one redundant legacy notification prefix.
# No application data changes, full migration replay, APK build or Worker deploy.
name: Retire redundant legacy notification recipient index
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths:
      - '.github/workflows/retire-legacy-notification-recipient.yml'
      - 'scripts/admin/retire_legacy_notification_index.py'
permissions:
  contents: read
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  retire:
    if: contains(github.event.head_commit.message, '[retire-legacy-notification-recipient]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove read equivalence, privacy and write-index reduction before live changes
        run: |
          npm test
          python3 -m unittest discover -s scripts/tests
          python3 cloudflare/test/schema_test.py
          python3 cloudflare/test/migration_test.py
          python3 cloudflare/test/index_plan_test.py
          QUOTA_EXPERIMENT_FRIEND_INDEXES=1 node scripts/loadtest/d1_quota_replay.mjs 30 > /tmp/legacy-notification-retirement-replay.json
      - name: Require exact live replacement DDL and recipient seek then retire only redundant prefix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/admin/retire_legacy_notification_index.py --apply
