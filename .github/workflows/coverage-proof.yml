# One read-only line of proof, isolated so the annotation is never truncated.
name: Legacy coverage proof
on:
  workflow_dispatch:
    inputs:
      confirm_production_scan:
        description: 'Explicitly authorize production D1 diagnostic/migration cost; not routine app work'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_scan == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Per-collection legacy-only coverage
        run: python3 -m scripts.loadtest.verify_root_backfill
