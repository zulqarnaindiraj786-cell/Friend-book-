name: Verify FriendBook Android candidate
on:
  workflow_dispatch:
  push:
    branches: [arena/7c7ddb7b-friend-book]
  pull_request:
    paths: ['app/**', 'gradle/**', 'gradlew', '*.gradle', '.github/workflows/debug-apk.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            SDKM="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
            test -x "$SDKM"
            "$SDKM" 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - name: Compile and test the candidate
        run: |
          if ! gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain > android-build.log 2>&1; then
            tail -100 android-build.log
            grep -E 'error:|^> |^e: |FAILED|What went wrong' android-build.log | tail -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FriendBook-debug-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  signed-candidate:
    if: "github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[signed-candidate]'))"
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            SDKM="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
            test -x "$SDKM"
            "$SDKM" 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - name: Sign candidate with the existing release key
        env:
          FB_KEYSTORE_B64: ${{ secrets.FB_KEYSTORE_B64 }}
          FRIENDBOOK_RELEASE_STORE_PASSWORD: ${{ secrets.FB_KEYSTORE_PASSWORD || secrets.FRIENDBOOK_RELEASE_STORE_PASSWORD }}
          FRIENDBOOK_RELEASE_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS || secrets.FRIENDBOOK_RELEASE_KEY_ALIAS }}
          FRIENDBOOK_RELEASE_KEY_PASSWORD: ${{ secrets.FB_KEY_PASSWORD || secrets.FRIENDBOOK_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FB_KEYSTORE_B64:?Missing existing release keystore secret}"
          : "${FRIENDBOOK_RELEASE_STORE_PASSWORD:?Missing release store password secret}"
          : "${FRIENDBOOK_RELEASE_KEY_ALIAS:?Missing release key alias secret}"
          : "${FRIENDBOOK_RELEASE_KEY_PASSWORD:?Missing release key password secret}"
          umask 077
          export FRIENDBOOK_RELEASE_STORE_FILE="$RUNNER_TEMP/friendbook-candidate.p12"
          trap 'rm -f "$FRIENDBOOK_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$FB_KEYSTORE_B64" | base64 --decode > "$FRIENDBOOK_RELEASE_STORE_FILE"
          unset FB_KEYSTORE_B64
          if ! gradle :app:assembleRelease :app:bundleRelease -PfriendbookUnshrunkCandidate=true --max-workers=2 --no-daemon --console=plain > android-release.log 2>&1; then
            tail -100 android-release.log
            grep -Ei 'error|exception|daemon|failed|what went wrong|killed' android-release.log | tail -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: FriendBook-signed-candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
