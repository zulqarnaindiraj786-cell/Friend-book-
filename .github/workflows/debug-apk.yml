name: Build FriendBook D1 Debug APK

on:
  push:
    branches: ['arena/f6bf61bd-friend-book']
    paths:
      - 'app/**'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friendbook-d1-debug-apk
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK 36
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 2>/dev/null || true)"
            test -n "$SDKM" || { echo 'Android sdkmanager not found'; exit 1; }
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" 'platforms;android-36' 'build-tools;36.0.0'
          fi

      - name: Verify Firebase client configuration (Auth only)
        run: test -s app/google-services.json

      - name: Build debug APK with D1 interactions enabled
        run: |
          grep -q "D1_INTERACTIONS_ENABLED', 'true'" app/build.gradle
          gradle :app:assembleDebug :app:bundleDebug --no-daemon --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/debug/app-debug.aab

      - name: Record this debug APK signer SHA-1 for Firebase Google Sign-In
        shell: bash
        run: |
          CERT_INFO="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          SHA_RAW="$(printf '%s\n' "$CERT_INFO" | awk -F': ' '/certificate SHA-1 digest:/ {print toupper($2); exit}')"
          SHA1="$(printf '%s' "$SHA_RAW" | tr -d ':' | sed 's/../&:/g; s/:$//')"
          test -n "$SHA1" || { echo 'Could not extract debug APK signer SHA-1'; exit 1; }
          {
            echo '### Debug APK Google Sign-In certificate'
            echo
            echo 'Package: com.friendbook.social'
            echo
            echo "Add this SHA-1 under Firebase Console → Project Settings → Your apps → com.friendbook.social → SHA certificate fingerprints: $SHA1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK separately
        uses: actions/upload-artifact@v4
        with:
          name: FriendBook-D1-debug-APK-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug AAB separately
        uses: actions/upload-artifact@v4
        with:
          name: FriendBook-D1-debug-AAB-${{ github.sha }}
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 7
