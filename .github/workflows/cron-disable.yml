name: Retain 15-minute Worker cron and remove hourly trigger
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  retain-quarter-hour:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Remove hourly cron only; preserve 15-minute cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: 92f3d04598822de2e49e14561218d090
          SCRIPT: rough-firefly-dd7b
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['ACCOUNT']}/workers/scripts/{os.environ['SCRIPT']}/schedules"
          headers={'Authorization':f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",'Content-Type':'application/json'}
          def call(method='GET', body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          before=call().get('result',{}).get('schedules',[])
          expressions=sorted(item.get('cron') for item in before)
          desired=['*/15 * * * *']
          if expressions==['*/15 * * * *','0 * * * *']:
              result=call('PUT',[{'cron':'*/15 * * * *'}])
              if not result.get('success'):raise RuntimeError('Cloudflare schedule update rejected: '+json.dumps(result)[:500])
          elif expressions!=desired:
              raise RuntimeError('Refusing unexpected cron state: '+json.dumps(expressions))
          after=call().get('result',{}).get('schedules',[])
          actual=sorted(item.get('cron') for item in after)
          print('::notice::Before '+json.dumps(expressions)+'; after '+json.dumps(actual))
          if actual!=desired:raise RuntimeError('Expected only the 15-minute schedule')
          print('::notice::Hourly schedule removed; 15-minute schedule remains.')
          PY
