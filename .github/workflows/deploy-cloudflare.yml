name: Deploy existing Cloudflare Worker (D1 OFF)
on:
  push:
    branches: [main, 'arena/15a53658-friend-book']
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'package*.json'
      - 'cloudflare/**'
      - 'docs/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - 'scripts/admin/configure_video_r2.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/15a53658-friend-book'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require existing resources and active Cloudflare D1/R2/Realtime configuration
        run: |
          python3 - <<'PY'
          import pathlib, re, tomllib
          cfg = tomllib.loads(pathlib.Path('wrangler.toml').read_text())
          assert cfg['name'] == 'rough-firefly-dd7b'
          assert cfg['vars']['D1_INTERACTIONS_ENABLED'] == 'true'
          assert cfg['vars']['VIDEO_R2_ENABLED'] == 'true'
          assert cfg['vars']['VIDEO_R2_RETENTION_VERIFIED'] == 'true'
          assert cfg['vars']['REALTIME_WS_ENABLED'] == 'true'
          assert cfg['vars']['FIREBASE_PROJECT_ID'] == 'friendbook-17551'
          assert cfg['d1_databases'] == [{
              'binding': 'DB', 'database_name': 'friendbook-db',
              'database_id': 'e1c605ca-a50b-46c6-9deb-56dd1f70d163',
              'migrations_dir': 'cloudflare/migrations',
          }]
          android = pathlib.Path('app/build.gradle').read_text()
          gates = re.findall(r"buildConfigField\s+['\"]boolean['\"]\s*,\s*['\"]D1_INTERACTIONS_ENABLED['\"]\s*,\s*['\"]([^'\"]+)['\"]", android)
          assert gates in (['true'], ['false']), 'Android D1 gate must be valid'
          print('Existing Worker + DB verified; Cloudflare D1, Realtime Presence, and R2 Video enabled.')
          PY
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Local schema and migration tests only
        run: |
          python3 cloudflare/test/schema_test.py
          python3 cloudflare/test/migration_test.py
      - name: Verify Save Forever R2 configuration (no R2 object deletion)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_ACCESS_KEY_ID || secrets.CLOUDFLARE_ACCESS_ID || secrets.ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_SECRET_ID || secrets.SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python3 -m pip install 'requests==2.32.5'
          python3 scripts/admin/configure_video_r2.py

      - name: Ensure Workers KV namespace for live view counters (zero D1 row reads)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
        run: node cloudflare/ensure-views-kv.mjs

      - name: Deploy existing Worker and bind existing database (no migration)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN repository secret is missing or unavailable to this workflow. Do not paste it in chat.'
            exit 1
          fi
          if ! npm run deploy -- --var D1_INTERACTIONS_ENABLED:true --var VIDEO_R2_ENABLED:true --var VIDEO_R2_RETENTION_VERIFIED:true --var REALTIME_WS_ENABLED:true; then
            echo '::warning::Token lacks R2 bucket binding scope; deploying Worker with Cloudflare Realtime + D1 while preserving R2 config in repo.'
            cp wrangler.toml /tmp/wrangler.toml.bak
            python3 - <<'PY'
          import pathlib
          p = pathlib.Path('wrangler.toml')
          text = p.read_text()
          idx = text.find('# Existing owner-provided bucket.')
          if idx != -1:
              p.write_text(text[:idx])
          PY
            npm run deploy -- --var D1_INTERACTIONS_ENABLED:true --var VIDEO_R2_ENABLED:false --var VIDEO_R2_RETENTION_VERIFIED:false --var REALTIME_WS_ENABLED:true
            mv /tmp/wrangler.toml.bak wrangler.toml
          fi
      - name: Verify read-only Worker and D1 connectivity
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 4 --retry-all-errors --retry-delay 3 \
            https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/health -o /tmp/friendbook-health.json
          curl --fail --silent --show-error --max-time 30 --retry 4 --retry-all-errors --retry-delay 3 \
            https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/health/r2 -o /tmp/friendbook-health-r2.json
          python3 - <<'PY'
          import json
          with open('/tmp/friendbook-health.json') as f:
              assert json.load(f).get('ok') is True, 'Worker/D1 health check failed'
          with open('/tmp/friendbook-health-r2.json') as f:
              r2 = json.load(f)
              assert r2.get('ok') is True and r2.get('r2Bound') is True and r2.get('videoR2Enabled') is True, 'Worker/R2 health check failed'
          print('Worker health + read-only D1 SELECT 1 + R2 bucket head check passed. No user data was written.')
          PY
          code=$(curl --silent --show-error --max-time 30 -o /tmp/friendbook-auth.json -w '%{http_code}' \
            https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/me)
          test "$code" = 401
          pcode=$(curl --silent --show-error --max-time 30 -o /tmp/friendbook-presence.json -w '%{http_code}' \
            https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/presence/me)
          test "$pcode" = 401
          vcode=$(curl --silent --show-error --max-time 30 -X POST -o /tmp/friendbook-video.json -w '%{http_code}' \
            https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/videos)
          test "$vcode" = 401
          echo 'Unauthenticated profile, presence, and video requests rejected (401).'
          echo 'Deployment passed; Cloudflare Realtime Presence + Video routes active; D1 interaction gates remain OFF.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public Android-only release metadata
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { androidRelease } from './cloudflare/android-release.js';
          let lastBody = null;
          for (let i = 0; i < 8; i++) {
            const response = await fetch('https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/android-release?t=' + Date.now(), {
              headers: { 'cache-control': 'no-cache' },
              signal: AbortSignal.timeout(30000),
            });
            assert.equal(response.status, 200);
            lastBody = await response.json();
            if (lastBody && lastBody.versionCode === androidRelease.versionCode && lastBody.versionName === androidRelease.versionName) {
              break;
            }
            await new Promise((r) => setTimeout(r, 2000));
          }
          assert.deepEqual(lastBody, androidRelease);
          console.log('Public APK release metadata matches this build. No user data accessed.');
          JS
