# Deploy the validated Worker with engagement, request and feed-loading fixes.
name: Deploy FriendBook Cloudflare Worker (D1 ON)
on:
  push:
    branches: [main, 'arena/15a53658-friend-book', 'arena/f6bf61bd-friend-book', 'arena/7c7ddb7b-friend-book']
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'package*.json'
      - 'cloudflare/**'
      - 'docs/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - 'scripts/admin/configure_video_r2.py'
      - 'scripts/admin/migrate_firestore_to_d1.py'
      - 'scripts/tests/test_firestore_migration.py'
  workflow_dispatch:
permissions:
  contents: read
  # `pull-requests: write` lets the Analytics Engine report POST a comment on the pull request, but
  # refreshing that comment is an ISSUE comment edit, which answers HTTP 404 without `issues: write`.
  # An explicit permissions block sets every other scope to none, so it has to be named here.
  issues: write
  pull-requests: write
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/15a53658-friend-book' || github.ref == 'refs/heads/arena/f6bf61bd-friend-book' || (github.ref == 'refs/heads/arena/7c7ddb7b-friend-book' && github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-cloudflare-production]'))) && !contains(github.event.head_commit.message, '[no-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require existing resources and active Cloudflare D1/R2 configuration
        run: |
          python3 - <<'PY'
          import pathlib, re, tomllib
          cfg = tomllib.loads(pathlib.Path('wrangler.toml').read_text())
          assert cfg['name'] == 'rough-firefly-dd7b'
          assert cfg['vars']['CF_ACCOUNT_ID'] == '92f3d04598822de2e49e14561218d090'
          assert cfg['vars']['D1_INTERACTIONS_ENABLED'] == 'true'
          assert cfg['vars']['VIDEO_R2_ENABLED'] == 'true'
          assert cfg['vars']['VIDEO_R2_RETENTION_VERIFIED'] == 'true'
          assert cfg['vars']['FIREBASE_PROJECT_ID'] == 'friendbook-17551'
          assert cfg['d1_databases'] == [{
              'binding': 'DB', 'database_name': 'friendbook-db',
              'database_id': 'e1c605ca-a50b-46c6-9deb-56dd1f70d163',
              'migrations_dir': 'cloudflare/migrations',
          }]
          android = pathlib.Path('app/build.gradle').read_text()
          gates = re.findall(r"buildConfigField\s+['\"]boolean['\"]\s*,\s*['\"]D1_INTERACTIONS_ENABLED['\"]\s*,\s*['\"]([^'\"]+)['\"]", android)
          assert gates in (['true'], ['false']), 'Android D1 gate must be valid'
          print('Existing Worker + DB verified; Cloudflare D1 and R2 Video enabled.')
          PY
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Local schema and migration tests only
        run: |
          python3 cloudflare/test/schema_test.py
          python3 cloudflare/test/migration_test.py
          python3 cloudflare/test/index_plan_test.py
          python3 -m unittest scripts.tests.test_fcm_claim_migration_gate scripts.tests.test_d1_account_usage_analytics scripts.tests.test_retired_table_preflight scripts.tests.test_verify_retired_drop scripts.tests.test_retired_migration_gate
      - name: Verify Save Forever R2 configuration (no R2 object deletion)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_ACCESS_KEY_ID || secrets.CLOUDFLARE_ACCESS_ID || secrets.ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_SECRET_ID || secrets.SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python3 -m pip install 'requests==2.32.5'
          python3 scripts/admin/configure_video_r2.py

      - name: Ensure Workers KV namespace for live view counters (zero D1 row reads)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
        run: node cloudflare/ensure-views-kv.mjs

      - name: Bind Analytics Engine for view events (zero D1 writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
        run: node cloudflare/ensure-views-ae.mjs

      - name: Give the Worker an encrypted Analytics Engine read token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::warning::CLOUDFLARE_API_TOKEN unavailable; the Worker will write Analytics Engine events but serve counts from KV + memory (still zero D1 writes).'
            exit 0
          fi
          # Encrypted secret, never a plaintext --var: the Worker only uses it to query AE.
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CF_AE_TOKEN; then
            echo 'CF_AE_TOKEN secret stored; the Worker can read Analytics Engine counts.'
          else
            echo '::warning::Could not store CF_AE_TOKEN; AE counts will be served from KV + memory instead (still zero D1 writes).'
          fi

      - name: Configure private FCM server credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
          FIREBASE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
        run: |
          set +x
          python3 -c 'import json,os,sys; d=json.loads(os.environ["FIREBASE_ADMIN_SERVICE_ACCOUNT"]); sys.exit(0 if d.get("type")=="service_account" and d.get("project_id")=="friendbook-17551" and d.get("private_key") and d.get("client_email") else 1)'
          printf '%s' "$FIREBASE_ADMIN_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_ADMIN_SERVICE_ACCOUNT
          # Validate the send API without a real device, user payload or delivery.
          node --input-type=module <<'JS'
          import { googleToken, buildFcmMessage } from './cloudflare/fcm-push.js';
          try {
            const access = await googleToken(process.env);
            const r = await fetch('https://fcm.googleapis.com/v1/projects/friendbook-17551/messages:send', {
              method: 'POST', headers: { Authorization: `Bearer ${access}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ validate_only:true, message:buildFcmMessage({topic:'friendbook_validation_only'}, {type:'push_test', eventId:'validation_probe', title:'friendbook push test', body:'Validation only'}) }),
              signal: AbortSignal.timeout(12000),
            });
            const body = await r.json();
            const reason = body.error?.details?.map(d=>d.reason).find(x=>['SERVICE_DISABLED','IAM_PERMISSION_DENIED','ACCESS_TOKEN_SCOPE_INSUFFICIENT'].includes(x));
            console.log(`FCM validate-only: HTTP ${r.status}${reason ? ' ' + reason : ''}`);
            console.log(`${r.ok ? '::notice::' : '::warning::'}FCM payload validation HTTP ${r.status}${reason ? ' ' + reason : ''}`);
          } catch { console.warn('::warning::FCM validation probe could not reach the send API.'); }
          JS

      - name: Diagnose Cloudflare auth and apply pending D1 migrations
        id: d1_diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
          WRANGLER_SEND_METRICS: 'false'
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/d1-migration-diagnostics"
          log="$RUNNER_TEMP/d1-migration-diagnostics/cloudflare-d1-diagnostics.log"
          set -x
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_TOKEN is unavailable to this workflow.' | tee "$log"
            echo 'whoami_status=missing-token' >> "$GITHUB_OUTPUT"
            echo 'd1_list_status=missing-token' >> "$GITHUB_OUTPUT"
            echo 'migration_status=missing-token' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx wrangler whoami 2>&1 | tee "$log"
          whoami_status=${PIPESTATUS[0]}
          printf '%s\n' "whoami_exit_code=$whoami_status" | tee -a "$log"
          npx wrangler d1 list 2>&1 | tee -a "$log"
          d1_list_status=${PIPESTATUS[0]}
          printf '%s\n' "d1_list_exit_code=$d1_list_status" | tee -a "$log"
          pending=$(npx wrangler d1 migrations list friendbook-db --remote 2>&1)
          if [ "$?" -ne 0 ]; then
            echo 'Cannot inspect pending migrations; refusing deployment.' | tee -a "$log"
            echo "whoami_status=$whoami_status" >> "$GITHUB_OUTPUT"
            echo "d1_list_status=$d1_list_status" >> "$GITHUB_OUTPUT"
            echo 'migration_status=pending-list-failed' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never let destructive table removal ride along on any branch's deployment.
          if printf '%s\n' "$pending" | grep -q '0086_remove_unused_status_tables.sql'; then
            printf '%s\n' "$pending" > "$RUNNER_TEMP/retired-pending.txt"
            if [[ "$HEAD_COMMIT_MESSAGE" != *'[drop-retired-status]'* ]] || ! python3 scripts/loadtest/retired_migration_gate.py "$RUNNER_TEMP/retired-pending.txt" || ! python3 scripts/loadtest/d1_account_usage_analytics.py --retired-drop-budget || ! python3 scripts/loadtest/retired_table_preflight.py || ! python3 scripts/loadtest/d1_account_usage_analytics.py --retired-drop-budget; then
              echo 'Retired-table removal preflight failed; no migration attempted.' | tee -a "$log"
              echo "whoami_status=$whoami_status" >> "$GITHUB_OUTPUT"
              echo "d1_list_status=$d1_list_status" >> "$GITHUB_OUTPUT"
              echo 'migration_status=retired-table-preflight-failed' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$GITHUB_REF" = refs/heads/arena/7c7ddb7b-friend-book ]; then
            if printf '%s\n' "$pending" | grep -Eq '00([012][0-9]|3[0-3])_[a-z_]+\.sql'; then
              echo 'Remote schema must already be at migration 0033; refusing to replay older migrations.' | tee -a "$log"
              echo "whoami_status=$whoami_status" >> "$GITHUB_OUTPUT"
              echo "d1_list_status=$d1_list_status" >> "$GITHUB_OUTPUT"
              echo 'migration_status=baseline-not-ready' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The incremental FCM bridge makes only an empty table and trigger;
            # never mix it with an unexpected index build or backfill. Explicit
            # opt-in is required, and account analytics must retain a reserve.
            if printf '%s\n' "$pending" | grep -q '0085_fcm_claims_incremental.sql' || [[ "$HEAD_COMMIT_MESSAGE" == *'[fcm-bridge-only]'* ]]; then
              printf '%s\n' "$pending" > "$RUNNER_TEMP/fcm-pending.txt"
              if [[ "$HEAD_COMMIT_MESSAGE" != *'[fcm-bridge-only]'* ]] || ! python3 scripts/loadtest/fcm_claim_migration_gate.py pending "$RUNNER_TEMP/fcm-pending.txt" \
                || ! python3 scripts/loadtest/d1_account_usage_analytics.py --fcm-metadata-budget; then
                echo 'FCM metadata-only safety gate failed; no migration attempted.' | tee -a "$log"
                echo "whoami_status=$whoami_status" >> "$GITHUB_OUTPUT"
                echo "d1_list_status=$d1_list_status" >> "$GITHUB_OUTPUT"
                echo 'migration_status=fcm-metadata-preflight-failed' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if printf '%s\n' "$pending" | grep -q '0073_chat_membership_source_seek.sql'; then
              # Limit the one-off index build rather than unexpectedly consuming
              # a large fraction of the free daily quota. Aggregate only; no IDs.
              count_file="$RUNNER_TEMP/chat-membership-count.json"
              npx wrangler d1 execute friendbook-db --remote --json --command 'SELECT COUNT(*) AS n FROM (SELECT 1 FROM friendbook_cf_chat_participants LIMIT 5001)' > "$count_file" 2>> "$log"
              count_status=$?
              count=$(python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x[0]["success"]; print(int(x[0]["results"][0]["n"]))' "$count_file" 2>/dev/null)
              if [ "$count_status" -ne 0 ] || ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -gt 5000 ]; then
                echo 'Chat index build preflight failed or exceeds 5000 membership entries; no migration attempted.' | tee -a "$log"
                echo "whoami_status=$whoami_status" >> "$GITHUB_OUTPUT"
                echo "d1_list_status=$d1_list_status" >> "$GITHUB_OUTPUT"
                echo 'migration_status=chat-index-preflight-failed' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Chat index preflight: $count membership entries (bounded count only)." | tee -a "$log"
            fi
            if printf '%s\n' "$pending" | grep -q '0078_follow_trigger_cost.sql'; then
              python3 scripts/loadtest/follow_fast_exception_preflight.py --require-index-build-safe 2>&1 | tee -a "$log"
              preflight_status=${PIPESTATUS[0]}
              if [ "$preflight_status" -ne 0 ]; then
                echo 'Follow trigger rebuild preflight failed; no migration attempted.' | tee -a "$log"
                echo "whoami_status=$whoami_status" >> "$GITHUB_OUTPUT"
                echo "d1_list_status=$d1_list_status" >> "$GITHUB_OUTPUT"
                echo 'migration_status=follow-trigger-preflight-failed' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if printf '%s\n' "$pending" | grep -q '0077_user_follow_membership.sql'; then
              # The derived index is deliberately bounded before backfill; this
              # is not a prediction of D1 billing or capacity at future scale.
              python3 scripts/loadtest/follow_membership_preflight.py --require-index-build-safe 2>&1 | tee -a "$log"
              preflight_status=${PIPESTATUS[0]}
              if [ "$preflight_status" -ne 0 ]; then
                echo 'Follow membership preflight failed; no migration attempted.' | tee -a "$log"
                echo "whoami_status=$whoami_status" >> "$GITHUB_OUTPUT"
                echo "d1_list_status=$d1_list_status" >> "$GITHUB_OUTPUT"
                echo 'migration_status=follow-index-preflight-failed' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if printf '%s\n' "$pending" | grep -q '0084_friend_guard_exceptions.sql'; then
              # One bounded aggregate only. Refuse truncated/large data, invalid
              # JSON, excessive exceptions, unknown D1 read cost, or low/delayed
              # account headroom; never infer a hard billing guarantee.
              python3 scripts/loadtest/d1_account_usage_analytics.py --preflight-budget 2>&1 | tee -a "$log"
              before_status=${PIPESTATUS[0]}
              if [ "$before_status" -eq 0 ]; then
                python3 scripts/loadtest/friend_guard_index_preflight.py --require-index-build-safe 2>&1 | tee -a "$log"
                friend_status=${PIPESTATUS[0]}
              else
                friend_status=1
              fi
              if [ "$friend_status" -eq 0 ]; then
                python3 scripts/loadtest/d1_account_usage_analytics.py --preflight-budget 2>&1 | tee -a "$log"
                after_status=${PIPESTATUS[0]}
              else
                after_status=1
              fi
              if [ "$before_status" -ne 0 ] || [ "$friend_status" -ne 0 ] || [ "$after_status" -ne 0 ]; then
                echo 'Friendship index preflight failed; no migration attempted.' | tee -a "$log"
                echo "whoami_status=$whoami_status" >> "$GITHUB_OUTPUT"
                echo "d1_list_status=$d1_list_status" >> "$GITHUB_OUTPUT"
                echo 'migration_status=friend-index-preflight-failed' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if printf '%s\n' "$pending" | grep -q '0076_legacy_comment_page_indexes.sql'; then
              # Only aggregate bounded comment data; refuse an unexpectedly large
              # index build or exception-heavy data rather than consume quota blindly.
              python3 scripts/loadtest/legacy_comment_preflight.py --require-index-build-safe 2>&1 | tee -a "$log"
              preflight_status=${PIPESTATUS[0]}
              if [ "$preflight_status" -ne 0 ]; then
                echo 'Comment index preflight failed; no migration attempted.' | tee -a "$log"
                echo "whoami_status=$whoami_status" >> "$GITHUB_OUTPUT"
                echo "d1_list_status=$d1_list_status" >> "$GITHUB_OUTPUT"
                echo 'migration_status=comment-index-preflight-failed' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          npx wrangler d1 migrations apply friendbook-db --remote 2>&1 | tee -a "$log"
          migration_status=${PIPESTATUS[0]}
          printf '%s\n' "migration_exit_code=$migration_status" | tee -a "$log"
          if [ "$migration_status" -eq 0 ] && printf '%s\n' "$pending" | grep -q '0086_remove_unused_status_tables.sql'; then
            python3 -m scripts.loadtest.verify_retired_drop 2>&1 | tee -a "$log"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              echo 'Schema verification failed after migration; no Worker deployment attempted.' | tee -a "$log"
              migration_status='retired-schema-check-failed'
            fi
          fi
          if [ "$migration_status" = 0 ]; then
            # Verify on every deployment, not only the initial rollout: a later
            # deployment must not bypass a missing or altered bridge. Read
            # schema metadata only, never claims or application records.
            schema="$RUNNER_TEMP/fcm-bridge-schema.json"
            npx wrangler d1 execute friendbook-db --remote --json --command "SELECT type,name,sql FROM sqlite_master WHERE name IN ('friendbook_cf_fcm_device_claims','friendbook_cf_fcm_device_claims_v2','cf_fcm_claims_legacy_bridge') LIMIT 3" > "$schema" 2>> "$log"
            if [ "$?" -ne 0 ] || ! python3 scripts/loadtest/fcm_claim_migration_gate.py schema "$schema"; then
              echo 'FCM bridge schema verification failed; old Worker remains deployed.' | tee -a "$log"
              migration_status='fcm-schema-check-failed'
            fi
          fi
          echo "whoami_status=$whoami_status" >> "$GITHUB_OUTPUT"
          echo "d1_list_status=$d1_list_status" >> "$GITHUB_OUTPUT"
          echo "migration_status=$migration_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Cloudflare D1 migration diagnostics (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-d1-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/d1-migration-diagnostics/cloudflare-d1-diagnostics.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized D1 diagnostics to the open PR
        continue-on-error: true
        if: always()
        uses: actions/github-script@v7
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIAGNOSTICS_FILE: ${{ runner.temp }}/d1-migration-diagnostics/cloudflare-d1-diagnostics.log
        with:
          script: |
            const fs = require('fs');
            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prs = await github.rest.pulls.list({owner, repo, state: 'open', head: `${owner}:${branch}`});
            if (!prs.data.length) {
              core.warning('No open PR found for this branch; diagnostics remain available as the workflow artifact.');
              return;
            }
            let text = fs.existsSync(process.env.DIAGNOSTICS_FILE)
              ? fs.readFileSync(process.env.DIAGNOSTICS_FILE, 'utf8')
              : 'No diagnostics file was produced.';
            const token = process.env.CLOUDFLARE_API_TOKEN;
            if (token) text = text.split(token).join('[REDACTED_CLOUDFLARE_TOKEN]');
            text = text.replace(/```/g, "''' ");
            if (text.length > 8000) text = text.slice(-8000) + '\n[truncated to most recent 8000 characters]';
            await github.rest.issues.createComment({
              owner, repo, issue_number: prs.data[0].number,
              body: 'Cloudflare D1 diagnostic for workflow run ' + context.runId + ' (credentials redacted):\n\n' + text
            });

      - name: Stop unless Cloudflare auth and remote migrations passed
        if: always()
        env:
          WHOAMI_STATUS: ${{ steps.d1_diagnostics.outputs.whoami_status }}
          D1_LIST_STATUS: ${{ steps.d1_diagnostics.outputs.d1_list_status }}
          MIGRATION_STATUS: ${{ steps.d1_diagnostics.outputs.migration_status }}
        run: |
          test "$WHOAMI_STATUS" = 0 || { echo 'Cloudflare whoami failed; see diagnostics artifact.'; exit 1; }
          test "$D1_LIST_STATUS" = 0 || { echo 'Cloudflare D1 list failed; see diagnostics artifact.'; exit 1; }
          test "$MIGRATION_STATUS" = 0 || { echo 'Remote D1 migrations failed; see diagnostics artifact.'; exit 1; }

      - name: Deploy Worker with existing database bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN repository secret is missing or unavailable to this workflow. Do not paste it in chat.'
            exit 1
          fi
          mkdir -p /tmp/deploy-logs
          rm -f /tmp/deploy-logs/*.log /tmp/wrangler.toml.shipped
          cp wrangler.toml /tmp/wrangler.toml.bak
          VARS_R2_ON="--var D1_INTERACTIONS_ENABLED:true --var VIDEO_R2_ENABLED:true --var VIDEO_R2_RETENTION_VERIFIED:true"
          VARS_R2_OFF="--var D1_INTERACTIONS_ENABLED:true --var VIDEO_R2_ENABLED:false --var VIDEO_R2_RETENTION_VERIFIED:false"

          # Removes ONLY the Analytics Engine block. D1, R2, KV, crons and vars all stay, so a refused
          # AE binding can never cost another binding the way the old truncation fallback did.
          strip_ae() {
            python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('wrangler.toml')
          text = p.read_text()
          text = re.sub(r'# Every view is one Analytics Engine event[\s\S]*?\[\[analytics_engine_datasets\]\][^\[]*', '', text)
          text = re.sub(r'\[\[analytics_engine_datasets\]\][^\[]*', '', text)
          p.write_text(text)
          PY
          }

          # Removes ONLY the R2 block: the KV binding and the cron triggers sit after it.
          strip_r2() {
            python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('wrangler.toml')
          text = p.read_text()
          text = re.sub(r'# Existing owner-provided bucket[\s\S]*?\[\[r2_buckets\]\][^\[]*', '', text)
          text = re.sub(r'\[\[r2_buckets\]\][^\[]*', '', text)
          p.write_text(text)
          PY
          }

          # Every attempt keeps its raw wrangler output; report-views-ae.mjs publishes it on the pull
          # request, because a refused binding is otherwise invisible in a green run.
          attempt() {
            label="$1"; vars="$2"; log="/tmp/deploy-logs/$label.log"
            cp /tmp/wrangler.toml.bak wrangler.toml
            case "$label" in no-ae|no-ae-no-r2) strip_ae ;; esac
            case "$label" in no-r2|no-ae-no-r2) strip_r2 ;; esac
            {
              echo "===== deploy attempt: $label ====="
              echo "--- bindings in this attempt ---"
              grep -E '^(binding|dataset|id|database_id|bucket_name|name|main|crons) ' wrangler.toml || true
              echo "--- wrangler ---"
            } > "$log"
            # shellcheck disable=SC2086
            if npm run deploy -- $vars >> "$log" 2>&1; then
              cat "$log"
              cp wrangler.toml /tmp/wrangler.toml.shipped
              cp /tmp/wrangler.toml.bak wrangler.toml
              echo "DEPLOY_ATTEMPT_USED=$label" >> "$GITHUB_ENV"
              echo "Deployed with the '$label' configuration."
              return 0
            fi
