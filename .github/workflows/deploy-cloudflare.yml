            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### Cloudflare Workers Builds diagnostic\n\nBuild \`${report.buildId}\` — API HTTP ${report.httpStatus}; API success: ${report.apiSuccess}\n\n\`\`\`text\n${detail.slice(-16000)}\n\`\`\`\n`);
            if (response.status >= 400 || payload.success === false) console.log('Workers Builds diagnostic API returned an error; exact response is shown above.');
