          };
          (async () => {
            console.log('PROOF_PHASE: Firebase Auth account signup');
            const suffix = crypto.randomUUID().replaceAll('-', '');
            const email = `cf-d1-proof-${suffix}@example.com`;
            const password = crypto.randomBytes(24).toString('base64url');
            const signup = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${process.env.FIREBASE_API_KEY}`, {
              method: 'POST', headers: {'content-type':'application/json'},
              body: JSON.stringify({email, password, returnSecureToken: true})
            });
            const auth = await signup.json();
