          (async () => {
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/builds/builds/${process.env.WORKERS_BUILD_ID}/logs`;
            const response = await fetch(endpoint, {headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,Accept:'application/json'}});
            const raw = await response.text();
            let payload; try { payload=JSON.parse(raw); } catch { payload={raw:raw.slice(0,4000)}; }
            const redactions=[process.env.CLOUDFLARE_API_TOKEN].filter(Boolean);
            const redact = value => redactions.reduce((text,secret)=>text.replaceAll(secret,'[REDACTED_TOKEN]'),String(value));
            let lines = payload?.result?.lines || [];
            lines = lines.map(x => Array.isArray(x) ? x[x.length-1] : x).map(redact);
            const detail = lines.length ? lines.slice(-160).join('\n') : redact(JSON.stringify(payload));
            const report = {buildId:process.env.WORKERS_BUILD_ID,httpStatus:response.status,apiSuccess:payload.success,errors:(payload.errors||[]).map(e=>({...e,message:redact(e.message||'')})),logs:detail};
