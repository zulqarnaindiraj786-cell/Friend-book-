name: Deploy Cloudflare Worker + D1
on:
  push:
    branches: [main, 'arena/15a53658-friend-book', 'arena/99ebbf43-friend-book']
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'package*.json'
      - 'cloudflare/**'
      - 'docs/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - 'scripts/admin/configure_video_r2.py'
  workflow_dispatch:
permissions:
  contents: read
  # `pull-requests: write` lets the Analytics Engine report POST a comment on the pull request, but
  # refreshing that comment is an ISSUE comment edit, which answers HTTP 404 without `issues: write`.
  # An explicit permissions block sets every other scope to none, so it has to be named here.
  issues: write
  pull-requests: write
concurrency:
  group: friendbook-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/15a53658-friend-book' || github.ref == 'refs/heads/arena/99ebbf43-friend-book'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require existing resources and active Cloudflare D1/R2/Realtime configuration
        run: |
          python3 - <<'PY'
          import pathlib, re, tomllib
          cfg = tomllib.loads(pathlib.Path('wrangler.toml').read_text())
          assert cfg['name'] == 'rough-firefly-dd7b'
          assert cfg['vars']['D1_INTERACTIONS_ENABLED'] == 'true'
          assert cfg['vars']['VIDEO_R2_ENABLED'] == 'true'
          assert cfg['vars']['VIDEO_R2_RETENTION_VERIFIED'] == 'true'
          assert cfg['vars']['REALTIME_WS_ENABLED'] == 'true'
          assert cfg['vars']['FIREBASE_PROJECT_ID'] == 'friendbook-17551'
          assert cfg['d1_databases'] == [{
              'binding': 'DB', 'database_name': 'friendbook-db',
              'database_id': 'e1c605ca-a50b-46c6-9deb-56dd1f70d163',
              'migrations_dir': 'cloudflare/migrations',
          }]
          android = pathlib.Path('app/build.gradle').read_text()
          gates = re.findall(r"buildConfigField\s+['\"]boolean['\"]\s*,\s*['\"]D1_INTERACTIONS_ENABLED['\"]\s*,\s*['\"]([^'\"]+)['\"]", android)
          assert gates in (['true'], ['false']), 'Android D1 gate must be valid'
          print('Existing Worker + DB verified; Cloudflare D1, Realtime Presence, and R2 Video enabled.')
          PY
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Local schema and migration tests only
        run: |
          python3 cloudflare/test/schema_test.py
          python3 cloudflare/test/migration_test.py
      - name: Verify Save Forever R2 configuration (no R2 object deletion)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_ACCESS_KEY_ID || secrets.CLOUDFLARE_ACCESS_ID || secrets.ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_SECRET_ID || secrets.SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python3 -m pip install 'requests==2.32.5'
          python3 scripts/admin/configure_video_r2.py

      - name: Ensure Workers KV namespace for live view counters (zero D1 row reads)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
        run: node cloudflare/ensure-views-kv.mjs

      - name: Bind Analytics Engine for view events (zero D1 writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
        run: node cloudflare/ensure-views-ae.mjs

      - name: Give the Worker an encrypted Analytics Engine read token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::warning::CLOUDFLARE_API_TOKEN unavailable; the Worker will write Analytics Engine events but serve counts from KV + memory (still zero D1 writes).'
            exit 0
          fi
          # Encrypted secret, never a plaintext --var: the Worker only uses it to query AE.
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CF_AE_TOKEN; then
            echo 'CF_AE_TOKEN secret stored; the Worker can read Analytics Engine counts.'
          else
            echo '::warning::Could not store CF_AE_TOKEN; AE counts will be served from KV + memory instead (still zero D1 writes).'
          fi

      - name: Deploy existing Worker and bind existing database (no migration)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN repository secret is missing or unavailable to this workflow. Do not paste it in chat.'
            exit 1
          fi
          mkdir -p /tmp/deploy-logs
          rm -f /tmp/deploy-logs/*.log /tmp/wrangler.toml.shipped
          cp wrangler.toml /tmp/wrangler.toml.bak
          VARS_R2_ON="--var D1_INTERACTIONS_ENABLED:true --var CLOUDFLARE_ONLY:true --var VIDEO_R2_ENABLED:true --var VIDEO_R2_RETENTION_VERIFIED:true --var REALTIME_WS_ENABLED:true"
          VARS_R2_OFF="--var D1_INTERACTIONS_ENABLED:true --var CLOUDFLARE_ONLY:true --var VIDEO_R2_ENABLED:false --var VIDEO_R2_RETENTION_VERIFIED:false --var REALTIME_WS_ENABLED:true"

          # Removes ONLY the Analytics Engine block. D1, R2, KV, crons and vars all stay, so a refused
          # AE binding can never cost another binding the way the old truncation fallback did.
          strip_ae() {
            python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('wrangler.toml')
          text = p.read_text()
          text = re.sub(r'# Every view is one Analytics Engine event[\s\S]*?\[\[analytics_engine_datasets\]\][^\[]*', '', text)
          text = re.sub(r'\[\[analytics_engine_datasets\]\][^\[]*', '', text)
          p.write_text(text)
          PY
          }

          # Removes ONLY the R2 block: the KV binding and the cron triggers sit after it.
          strip_r2() {
            python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('wrangler.toml')
          text = p.read_text()
          text = re.sub(r'# Existing owner-provided bucket[\s\S]*?\[\[r2_buckets\]\][^\[]*', '', text)
          text = re.sub(r'\[\[r2_buckets\]\][^\[]*', '', text)
          p.write_text(text)
          PY
          }

          # Every attempt keeps its raw wrangler output; report-views-ae.mjs publishes it on the pull
          # request, because a refused binding is otherwise invisible in a green run.
          attempt() {
            label="$1"; vars="$2"; log="/tmp/deploy-logs/$label.log"
            cp /tmp/wrangler.toml.bak wrangler.toml
            case "$label" in no-ae|no-ae-no-r2) strip_ae ;; esac
            case "$label" in no-r2|no-ae-no-r2) strip_r2 ;; esac
            {
              echo "===== deploy attempt: $label ====="
              echo "--- bindings in this attempt ---"
              grep -E '^(binding|dataset|id|database_id|bucket_name|name|main|crons) ' wrangler.toml || true
              echo "--- wrangler ---"
            } > "$log"
            # shellcheck disable=SC2086
            if npm run deploy -- $vars >> "$log" 2>&1; then
              cat "$log"
              cp wrangler.toml /tmp/wrangler.toml.shipped
              cp /tmp/wrangler.toml.bak wrangler.toml
              echo "DEPLOY_ATTEMPT_USED=$label" >> "$GITHUB_ENV"
              echo "Deployed with the '$label' configuration."
              return 0
            fi
            echo "::warning::Deploy attempt '$label' was refused; its raw wrangler output is kept for the Analytics Engine report."
            tail -n 25 "$log"
            return 1
          }

          attempt full "$VARS_R2_ON" && exit 0
          echo '::warning::Retrying without ONLY the Analytics Engine binding. Views then count in the snapshot + memory, still with zero D1 writes.'
          attempt no-ae "$VARS_R2_ON" && exit 0
          echo '::warning::Retrying without ONLY the R2 bucket binding (Analytics Engine kept).'
          attempt no-r2 "$VARS_R2_OFF" && exit 0
          echo '::warning::Last resort: no Analytics Engine and no R2 binding.'
          attempt no-ae-no-r2 "$VARS_R2_OFF" && exit 0
          cp /tmp/wrangler.toml.bak wrangler.toml
          echo '::error::Every deploy attempt was refused. The raw wrangler output of each attempt is in the Analytics Engine report on the pull request.'
          exit 1

      - name: Verify read-only Worker and D1 connectivity
        run: |
          set -e
          curl --fail --silent --show-error --max-time 30 --retry 4 --retry-all-errors --retry-delay 3 \
            https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/health -o /tmp/friendbook-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/friendbook-health.json') as f:
              h = json.load(f)
              if h.get('ok') is not True:
                  print(f"::error title=Worker health check failed::{h}")
                  raise SystemExit(1)
          PY
          if [ "${DEPLOY_ATTEMPT_USED:-full}" = "full" ] || [ "${DEPLOY_ATTEMPT_USED:-full}" = "no-ae" ]; then
            curl --fail --silent --show-error --max-time 30 --retry 4 --retry-all-errors --retry-delay 3 \
              https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/health/r2 -o /tmp/friendbook-health-r2.json
            python3 - <<'PY'
          import json
          with open('/tmp/friendbook-health-r2.json') as f:
              r2 = json.load(f)
              if not (r2.get('ok') is True and r2.get('r2Bound') is True and r2.get('videoR2Enabled') is True):
                  print(f"::error title=Worker R2 health check failed::{r2}")
                  raise SystemExit(1)
          PY
          fi
          check_401() {
            method="$1"; url="$2"; code="000"
            for _ in 1 2 3 4 5 6 7 8; do
              code=$(curl --silent --show-error --max-time 20 -X "$method" -o /tmp/fb-check.json -w '%{http_code}' "$url?t=$(date +%s%N)")
              if [ "$code" = "401" ]; then return 0; fi
              sleep 2
            done
            echo "::error title=Auth gate check failed::$method $url returned $code instead of 401"
            return 1
          }
          check_401 GET https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/me
          check_401 GET https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/presence/me
          check_401 POST https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/videos
          check_401 POST https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/cfdb/get
          check_401 GET https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/rtdb/test
          echo 'Unauthenticated profile, presence, video, cfdb, and rtdb requests rejected (401).'
          echo 'Deployment passed; Cloudflare D1 + Realtime Presence + Video routes active.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public Android-only release metadata
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { androidRelease } from './cloudflare/android-release.js';
          let lastBody = null;
          for (let i = 0; i < 8; i++) {
            const response = await fetch('https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/android-release?t=' + Date.now(), {
              headers: { 'cache-control': 'no-cache' },
              signal: AbortSignal.timeout(30000),
            });
            assert.equal(response.status, 200);
            lastBody = await response.json();
            if (lastBody && lastBody.versionCode === androidRelease.versionCode && lastBody.versionName === androidRelease.versionName) {
              break;
            }
            await new Promise((r) => setTimeout(r, 2000));
          }
          assert.deepEqual(lastBody, androidRelease);
          console.log('Public APK release metadata matches this build. No user data accessed.');
          JS
      - name: Report Analytics Engine view counters (deployed bindings + raw AE answers)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '92f3d04598822de2e49e14561218d090'
        run: node cloudflare/report-views-ae.mjs
