            const claims = JSON.parse(Buffer.from(auth.idToken.split('.')[1], 'base64url').toString('utf8'));
            console.log('Firebase Auth token claims:', JSON.stringify({aud:claims.aud, iss:claims.iss, subjectMatchesAuthUid:claims.sub === uid, auth_time:claims.auth_time, iat:claims.iat, exp:claims.exp}));
            console.log('PROOF_PHASE: Firebase Auth accounts:lookup validates issued ID token');
            const lookup = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=${process.env.FIREBASE_API_KEY}`, {
              method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({idToken:auth.idToken})
            });
            const lookupBody = await lookup.json().catch(() => ({}));
            if (!lookup.ok) fail(`Firebase Auth issued ID-token lookup failed: HTTP ${lookup.status} ${lookupBody.error?.message || lookupBody.error || 'unknown error'}`);
            const lookedUpUser = lookupBody.users?.[0];
            console.log('Firebase ID-token lookup:', JSON.stringify({status:lookup.status, userFound:Boolean(lookedUpUser), subjectMatchesAuthUid:lookedUpUser?.localId === uid, providerIds:(lookedUpUser?.providerUserInfo || []).map(x=>x.providerId)}));
            console.log('PROOF_PHASE: Worker /v1/me verifies Firebase ID token');
            const authCheck = await fetch(new URL('/v1/me', process.env.WORKER_URL), {headers:{authorization:`Bearer ${auth.idToken}`}});
            const authCheckBody = await authCheck.text();
            console.log('Worker Firebase identity check:', authCheck.status, authCheckBody.slice(0,500));
            console.log('PROOF_PHASE: Worker /v1/me response', JSON.stringify({status:authCheck.status, body:authCheckBody.slice(0,500)}));
            if (!authCheck.ok) fail(`Worker /v1/me rejected Firebase ID token: HTTP ${authCheck.status} ${authCheckBody.slice(0,500)}`);
            const docPath = `users/${uid}`;
            const workerUrl = new URL('/v1/firestore/document', process.env.WORKER_URL);
            workerUrl.searchParams.set('path', docPath);
            const payload = {data: {uid, email, displayName: 'Cloudflare D1 migration proof', proofMarker: 'd1-only', createdAt: new Date().toISOString()}};
            console.log('PROOF_PHASE: authenticated Worker D1 document write');
            const put = await fetch(workerUrl, {
              method: 'PUT', headers: {'authorization': `Bearer ${auth.idToken}`, 'content-type':'application/json'},
              body: JSON.stringify(payload)
            });
            const putBody = await put.json().catch(() => ({}));
            if (!put.ok || putBody.path !== docPath || putBody.data?.proofMarker !== 'd1-only') fail(`Worker D1 write failed: HTTP ${put.status} ${JSON.stringify(putBody)}`);
            console.log('PROOF_PHASE: authenticated Worker D1 document read-back');
            const readBack = await fetch(workerUrl, {headers:{authorization:`Bearer ${auth.idToken}`}});
            const readBody = await readBack.json().catch(() => ({}));
            if (!readBack.ok || readBody.path !== docPath || readBody.data?.uid !== uid || readBody.data?.proofMarker !== 'd1-only') {
              fail(`Authenticated Worker D1 read-back failed: HTTP ${readBack.status} ${JSON.stringify(readBody)}`);
            }
            console.log('Authenticated Worker read-back:', JSON.stringify({status:readBack.status, path:readBody.path, uid:readBody.data.uid, proofMarker:readBody.data.proofMarker}));

            console.log('PROOF_PHASE: Cloudflare remote D1 row verification');
            const sql = `SELECT path, owner_uid, document_json FROM friendbook_cf_firestore_documents WHERE path = '${docPath}'`;
            const d1 = spawnSync('npx', ['wrangler','d1','execute','friendbook-db','--remote','--command',sql,'--json'], {encoding:'utf8'});
            if (d1.status !== 0) fail(`Remote D1 read failed: ${d1.stderr || d1.stdout}`);
            fs.writeFileSync('live-d1-proof/d1-query.json', d1.stdout);
            const query = JSON.parse(d1.stdout);
            const row = query.flatMap(x => x.results || []).find(r => r.path === docPath && r.owner_uid === uid);
            if (!row || !row.document_json.includes('d1-only') || !row.document_json.includes(email)) fail('Expected test profile row missing from Cloudflare D1.');

            console.log('Verified Cloudflare D1 row:', JSON.stringify({path:row.path, owner_uid:row.owner_uid, proofMarker:'d1-only'}));
            const report = {result:'PASS', firebaseAuthUserCreated:true, firebaseIdTokenVerifiedByWorker:true,
              workerProfileBeforeWrite:authCheck.status, authenticatedD1DocumentWrite:true, authenticatedD1DocumentReadBack:true,
              remoteD1SqlRowMatched:true, workerPath:docPath,
              cloudflareD1Row:{path:row.path, owner_uid:row.owner_uid, proofMarker:'d1-only'},
              firestoreDataRequests:0};
            fs.writeFileSync('live-d1-proof/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          })().catch(e => fail(`Live D1 proof failed: ${e.message}`));
          NODE

      - name: Print authenticated D1 proof result in Job Summary
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[live-d1-proof]')
        env:
          PROOF_LOG: live-d1-proof/run.log
          PROOF_ERROR: live-d1-proof/error.txt
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          log = pathlib.Path(os.environ['PROOF_LOG'])
          error = pathlib.Path(os.environ['PROOF_ERROR'])
          text = log.read_text(errors='replace') if log.exists() else ''
          if error.exists(): text += '\n' + error.read_text(errors='replace')
          text = re.sub(r'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', '[REDACTED_JWT]', text)
          text = re.sub(r'AIza[0-9A-Za-z_-]{20,}', '[REDACTED_API_KEY]', text)
          text = re.sub(r'(?i)(password["\s:=]+)[^,}\s]+', r'\1[REDACTED]', text)
          lines = [line[-1000:] for line in text.splitlines() if line.strip()]
          summary = '### Authenticated Firebase-to-D1 proof\n\n' + ('\n'.join(lines[-60:]) if lines else 'No proof log was produced.') + '\n'
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)
          pathlib.Path('live-d1-proof/public-summary.txt').write_text(summary)
          print(summary)
          PY

      - name: Upload live D1 proof
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[live-d1-proof]')
        uses: actions/upload-artifact@v4
        with:
          name: live-cloudflare-d1-proof-${{ github.run_id }}
          path: live-d1-proof/
          if-no-files-found: error
          retention-days: 30

      - name: Publish live D1 proof result to the open PR
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[live-d1-proof]')
        uses: actions/github-script@v7
        env:
          PROOF_LOG: live-d1-proof/public-summary.txt
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({owner, repo, state: 'open', head: `${owner}:${branch}`});
            if (!prs.data.length) return core.warning('No PR found to publish the proof summary.');
            const log = fs.existsSync(process.env.PROOF_LOG) ? fs.readFileSync(process.env.PROOF_LOG, 'utf8') : 'Proof step did not produce a log.';
            const body = 'Live D1 proof for workflow run ' + context.runId + ':\n\n' + log.slice(-10000);
            await github.rest.issues.createComment({owner, repo, issue_number: prs.data[0].number, body});

      - name: Verify public Android-only release metadata
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { androidRelease } from './cloudflare/android-release.js';
          let lastBody = null;
          for (let i = 0; i < 8; i++) {
            const response = await fetch('https://rough-firefly-dd7b.zulqarnaindiraj786.workers.dev/v1/android-release?t=' + Date.now(), {
              headers: { 'cache-control': 'no-cache' },
              signal: AbortSignal.timeout(30000),
            });
            assert.equal(response.status, 200);
            lastBody = await response.json();
            if (lastBody && lastBody.versionCode === androidRelease.versionCode && lastBody.versionName === androidRelease.versionName) {
              break;
            }
            await new Promise((r) => setTimeout(r, 2000));
          }
          assert.deepEqual(lastBody, androidRelease);
          console.log('Public APK release metadata matches this build. No user data accessed.');
          JS
