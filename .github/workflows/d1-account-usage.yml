# Read-only account-wide analytics only. No D1 SQL, mutations, or app traffic.
# Compare whole-account totals during the continuing whole-app quota investigation.
name: Read-only account D1 usage
on:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths:
      - '.github/workflows/d1-account-usage.yml'
      - 'scripts/loadtest/d1_account_usage_analytics.py'
      - 'scripts/tests/test_d1_account_usage_analytics.py'
permissions: {}
jobs:
  usage:
    if: contains(github.event.head_commit.message, '[d1-account-usage]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Test response validation
        run: python3 -m unittest discover -s scripts/tests -p 'test_d1_account_usage_analytics.py' -v
      - name: Read daily account analytics without querying D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/d1_account_usage_analytics.py
