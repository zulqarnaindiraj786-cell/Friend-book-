# Read-only account-wide analytics only. No D1 SQL, mutations, or app traffic.
# Compare whole-account totals after disabling typing and optimizing live/call checks.
name: Read-only account D1 usage
on:
  push:
    branches: [arena/b52bc74d-friend-book]
    paths:
      - '.github/workflows/d1-account-usage.yml'
      - 'scripts/loadtest/d1_account_usage_analytics.py'
      - 'scripts/tests/test_d1_account_usage_analytics.py'
permissions: {}
jobs:
  usage:
    if: contains(github.event.head_commit.message, '[d1-account-usage]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Test response validation
        run: python3 -m unittest discover -s scripts/tests -p 'test_d1_account_usage_analytics.py' -v
      - name: Read daily account analytics without querying D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/d1_account_usage_analytics.py

      - name: Read only deployed guard flag and deployment metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PYMETA'
          import json, os, urllib.request
          base='https://api.cloudflare.com/client/v4/accounts/92f3d04598822de2e49e14561218d090/workers/scripts/rough-firefly-dd7b'
          def get(suffix):
              req=urllib.request.Request(base+suffix,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
              with urllib.request.urlopen(req,timeout=25) as response: payload=json.load(response)
              if not payload.get('success'): raise SystemExit('Read-only Worker metadata unavailable')
              return payload['result']
          settings=get('/settings')
          flag=next((x.get('text') for x in settings.get('bindings',[]) if x.get('name')=='FRIEND_GUARD_INDEXED' and x.get('type')=='plain_text'),None)
          print('::notice::Deployed FRIEND_GUARD_INDEXED='+json.dumps(flag))
          deployments=get('/deployments')
          rows=deployments.get('deployments',[]) if isinstance(deployments,dict) else deployments
          if rows:
              latest=rows[0]
              print('::notice::Active deployment metadata '+json.dumps({k:latest.get(k) for k in ['id','created_on','versions']},sort_keys=True))
          PYMETA
