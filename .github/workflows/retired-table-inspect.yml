# Read-only and capped; this workflow never executes migration SQL.
name: Retired table size preflight
on:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths: [.github/workflows/retired-table-inspect.yml, scripts/loadtest/retired_table_preflight.py, scripts/tests/test_retired_table_preflight.py]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[retired-table-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts.tests.test_retired_table_preflight
      - name: Check quota reserve and bounded table counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python3 scripts/loadtest/d1_account_usage_analytics.py --notification-inspection-budget
          python3 scripts/loadtest/retired_table_preflight.py
          python3 scripts/loadtest/d1_account_usage_analytics.py --notification-inspection-budget
