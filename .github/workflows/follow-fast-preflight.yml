# Read-only aggregate; no user values, test traffic or production mutations.
name: Follow-trigger cost preflight
on:
  push:
    branches: [arena/7c7ddb7b-friend-book]
    paths: [.github/workflows/follow-fast-preflight.yml, scripts/loadtest/follow_fast_exception_preflight.py]
permissions:
  contents: read
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[follow-trigger-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bounded conservative exception counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/loadtest/follow_fast_exception_preflight.py
